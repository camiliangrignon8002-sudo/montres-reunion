<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="noindex" name="robots">
    <title>Vérification — Superimmo.com</title>
    <script>
      // Le bouton reste désactivé tant que Turnstile n'a pas délivré de
      // token : impossible de soumettre sans avoir résolu la vérification.
      // Une fois le token reçu, on soumet tout de suite et on redésactive
      // le bouton pour éviter un double envoi (token consommé deux fois).
      function onCaptchaSuccess() {
        var form = document.getElementById("captcha-form");
        var button = document.getElementById("captcha-submit");
        if (button) { button.disabled = false; }
        if (form) {
          form.submit();
          if (button) { button.disabled = true; }
        }
      }
      function onCaptchaReset() {
        var button = document.getElementById("captcha-submit");
        if (button) { button.disabled = true; }
      }
    </script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
  :root {
    --ground: #f9f9f6;
    --cream: #fff7eb;
    --ink: #282828;
    --ink-soft: #6b6b68;
    --pink: #f90362;
    --pink-light: #ff5697;
    --blue: #0063c6;
    --blue-deep: #0454a4;
    --yellow: #ffe71c;
    --paper: #ffffff;
    --line: #e2ddd6;
  }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 32px 16px 40px;
    box-sizing: border-box;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(40, 40, 40, .04),
                0 12px 28px -12px rgba(40, 40, 40, .18);
  }

  /* Signature trois couleurs */
  .rule { display: flex; height: 5px; }
  .rule i { flex: 1; }
  .rule i:nth-child(1) { background: var(--pink); }
  .rule i:nth-child(2) { background: var(--blue); }
  .rule i:nth-child(3) { background: var(--yellow); }

  /* ── Scène ─────────────────────────────────────────── */
  .scene {
    background: var(--cream);
    border-bottom: 1px solid var(--line);
    padding: 16px 0 8px;
  }
  .scene svg { display: block; width: 100%; height: auto; max-width: 100%; }

  .hop { transform-box: fill-box; transform-origin: bottom center; }
  .shadow { transform-box: fill-box; transform-origin: center; }

  .h1 { animation: hop 1.45s cubic-bezier(.33, 0, .3, 1) infinite; }
  .h2 { animation: hop 1.45s cubic-bezier(.33, 0, .3, 1) infinite .16s; }
  .h3 { animation: hop 1.45s cubic-bezier(.33, 0, .3, 1) infinite .32s; }
  .s1 { animation: squish 1.45s cubic-bezier(.33, 0, .3, 1) infinite; }
  .s2 { animation: squish 1.45s cubic-bezier(.33, 0, .3, 1) infinite .16s; }
  .s3 { animation: squish 1.45s cubic-bezier(.33, 0, .3, 1) infinite .32s; }

  @keyframes hop {
    0%,  100% { transform: translateY(0) scale(1, 1); }
    10%       { transform: translateY(0) scale(1.09, .91); }
    38%       { transform: translateY(-18px) scale(.95, 1.05); }
    56%       { transform: translateY(-20px) scale(1, 1); }
    80%       { transform: translateY(0) scale(1.11, .89); }
    92%       { transform: translateY(0) scale(.98, 1.02); }
  }
  @keyframes squish {
    0%,  100% { transform: scaleX(1);   opacity: .22; }
    10%       { transform: scaleX(1.1); opacity: .24; }
    48%       { transform: scaleX(.5);  opacity: .07; }
    80%       { transform: scaleX(1.1); opacity: .24; }
  }

  /* ── Contenu ───────────────────────────────────────── */
  .body { padding: 24px 26px 26px; display: flex; flex-direction: column; gap: 14px; }

  .eyebrow {
    margin: 0;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--pink);
  }

  h1 {
    margin: 0;
    font-size: clamp(1.3rem, 5.4vw, 1.55rem);
    line-height: 1.24;
    font-weight: 800;
    letter-spacing: -.022em;
    text-wrap: balance;
  }
  h1 mark {
    background: linear-gradient(transparent 58%, var(--yellow) 58%);
    color: inherit;
    padding: 0 1px;
  }

  .lede { margin: 0; color: var(--ink-soft); }

  form { display: flex; flex-direction: column; gap: 16px; margin: 4px 0 0; }
  .cf-turnstile { display: flex; justify-content: center; min-height: 65px; }

  .btn {
    appearance: none;
    align-self: center;
    padding: 10px 26px;
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    color: var(--paper);
    background: var(--pink);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color .15s, transform .08s;
  }
  .btn:hover { background: #d40254; }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 3px solid rgba(249, 3, 98, .35); outline-offset: 3px; }
  .btn:disabled { background: var(--ink-soft); opacity: .45; cursor: not-allowed; transform: none; }

  .note {
    margin: 0;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 13px;
    color: var(--ink-soft);
  }
  .note b { color: var(--blue-deep); font-weight: 600; }

  .brand img { display: block; width: 148px; height: auto; }


  @media (prefers-reduced-motion: reduce) {
    .hop, .shadow { animation: none !important; }
  }
    </style>
</head>
<body>
<div class="page">
  <main class="card">
    <div class="rule"><i></i><i></i><i></i></div>

    <div class="scene">
      <svg viewBox="0 0 280 128" role="img" aria-label="Trois maisons qui rebondissent">
        <g stroke="#282828" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">

          <!-- ombres -->
          <ellipse class="shadow s1" cx="54"  cy="112" rx="26" ry="4.5" fill="#282828" stroke="none"/>
          <ellipse class="shadow s2" cx="140" cy="112" rx="32" ry="5"   fill="#282828" stroke="none"/>
          <ellipse class="shadow s3" cx="226" cy="112" rx="28" ry="4.5" fill="#282828" stroke="none"/>

          <!-- maison rose -->
          <g class="hop h1">
            <rect x="34" y="72" width="40" height="36" rx="2" fill="#ffffff"/>
            <path d="M26 74 L54 48 L82 74 Z" fill="var(--pink)"/>
            <rect x="47" y="90" width="14" height="18" rx="1.5" fill="var(--pink)"/>
            <rect x="38" y="79" width="10" height="9" rx="1.5" fill="var(--yellow)"/>
            <rect x="60" y="79" width="10" height="9" rx="1.5" fill="var(--yellow)"/>
          </g>

          <!-- maison bleue -->
          <g class="hop h2">
            <rect x="114" y="60" width="52" height="48" rx="2" fill="#ffffff"/>
            <path d="M106 62 L140 32 L174 62 Z" fill="var(--blue)"/>
            <rect x="163" y="40" width="8" height="16" rx="1.5" fill="var(--blue)"/>
            <rect x="130" y="86" width="20" height="22" rx="1.5" fill="var(--blue)"/>
            <rect x="119" y="68" width="11" height="10" rx="1.5" fill="var(--yellow)"/>
            <rect x="150" y="68" width="11" height="10" rx="1.5" fill="var(--yellow)"/>
          </g>

          <!-- maison jaune -->
          <g class="hop h3">
            <rect x="204" y="68" width="44" height="40" rx="2" fill="#ffffff"/>
            <path d="M196 70 L226 44 L256 70 Z" fill="var(--yellow)"/>
            <rect x="218" y="88" width="16" height="20" rx="1.5" fill="var(--yellow)"/>
            <rect x="208" y="76" width="10" height="9" rx="1.5" fill="var(--blue)"/>
            <rect x="234" y="76" width="10" height="9" rx="1.5" fill="var(--blue)"/>
          </g>

          <!-- sol -->
          <path d="M12 108 H268" stroke="#282828" stroke-width="3"/>
        </g>
      </svg>
    </div>

    <div class="body">
      <p class="eyebrow">Vérification</p>
      <h1>On s’assure que vous n’êtes <mark>pas un robot</mark></h1>
      <p class="lede">
        Un trafic automatisé inhabituel nous a fait vous arrêter au passage.
        Ça se règle tout seul, en une seconde, sans rien à résoudre.
      </p>

      <form action="/turnstile" method="POST" id="captcha-form">
        <div class="cf-turnstile"
             data-sitekey="0x4AAAAAAE-t8RH9xHeevs5V"
             data-callback="onCaptchaSuccess"
             data-expired-callback="onCaptchaReset"
             data-error-callback="onCaptchaReset"
             data-language="fr">
        </div>
        <input value="/location/appartement/saint-denis-97400" type="hidden" name="redirect_to">
        <button type="submit" class="btn" id="captcha-submit" disabled>Continuer</button>
      </form>

      <p class="note">Vous reprenez ensuite <b>exactement là où vous en étiez</b>.</p>
    </div>
  </main>

  <div class="brand">
    <img src="/resources/logos/superimmo-medium-com.png" alt="Superimmo.com" width="360" height="79">
  </div>
</div>
</body>
</html>
