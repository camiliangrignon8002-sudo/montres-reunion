name: Biens à vendre Réunion

on:
  schedule:
    - cron: "7 6 * * 1"    # chaque lundi vers 10h (heure de La Réunion) : la liste de la semaine
  workflow_dispatch:       # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

concurrency:
  group: immo
  cancel-in-progress: false

jobs:
  recherche:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python immo.py
      - name: Publier la liste
        if: always()
        run: |
          git config user.name "immo-bot"
          git config user.email "immo-bot@users.noreply.github.com"
          git add docs/immo/biens.json
          git diff --cached --quiet || git commit -m "Biens à vendre de la semaine $(date -u +%F)"
          for essai in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
