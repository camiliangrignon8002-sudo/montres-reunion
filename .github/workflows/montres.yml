name: Montres Réunion

on:
  # Pas de lancement automatique : Leboncoin bloque les serveurs GitHub (captcha).
  # La recherche quotidienne tourne sur le Mac (voir install.sh).
  workflow_dispatch:       # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

jobs:
  recherche:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python montres.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'montres974-ut9qstgpdc' }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Publier la page
        if: always()
        run: |
          git config user.name "montres-bot"
          git config user.email "montres-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Mise à jour des montres $(date -u +%F)"
          git push
