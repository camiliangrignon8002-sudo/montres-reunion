name: Montres Réunion

on:
  schedule:
    - cron: "0 6 * * *"        # 10h à La Réunion : recherche + notification
    - cron: "30 2-18/2 * * *"  # toutes les 2 h de 6h30 à 22h30 (Réunion) : la page se met à jour, sans notification
  workflow_dispatch:       # bouton "Run workflow" pour lancer à la main
    inputs:
      notifier:
        description: "Envoyer les notifications"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  recherche:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python montres.py
        env:
          NOTIFIER: ${{ (github.event_name == 'workflow_dispatch' && inputs.notifier) || github.event.schedule == '0 6 * * *' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'montres974-ut9qstgpdc' }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Publier la page
        if: always()
        run: |
          git config user.name "montres-bot"
          git config user.email "montres-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Mise à jour des montres $(date -u +%F)"
          git push
