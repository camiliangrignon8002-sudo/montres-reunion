name: Logements Nord Réunion

on:
  schedule:
    - cron: "15 * * * *"   # toutes les heures, jour et nuit : nouvelle recherche + notification des nouveaux logements
  workflow_dispatch:       # bouton "Run workflow" pour lancer à la main
    inputs:
      notifier:
        description: "Envoyer les notifications"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: logements
  cancel-in-progress: false

jobs:
  recherche:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python logements.py
        env:
          NOTIFIER: ${{ github.event_name == 'schedule' || inputs.notifier }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC_LOGEMENTS || 'logements974-w9y80xhxga' }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/logements/
      - name: Publier la page
        if: always()
        run: |
          git config user.name "logements-bot"
          git config user.email "logements-bot@users.noreply.github.com"
          git add docs/logements data/logements_*.json
          git diff --cached --quiet || git commit -m "Mise à jour des logements $(date -u +%F)"
          # le code a pu changer pendant la recherche : on se remet à jour avant de publier
          for essai in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
