name: Apple Réunion

on:
  schedule:
    - cron: "20 2-18/3 * * *"   # toutes les 3 h de 6h20 à 22h20 (heure de La Réunion)
    - cron: "45 7 * * *"         # 11h45 à La Réunion : recherche + notification de midi (résumé des nouveautés)
  workflow_dispatch:             # bouton "Run workflow" pour lancer à la main
    inputs:
      sources:
        description: "Sources à lire, séparées par des virgules (vide = toutes)"
        default: ""
      notifier:
        description: "Envoyer la notification du jour"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apple
  cancel-in-progress: false

jobs:
  recherche:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python apple.py
        env:
          SOURCES: ${{ inputs.sources }}
          NOTIFIER: ${{ github.event.schedule == '45 7 * * *' || inputs.notifier == true }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC_APPLE || 'apple974-hcmkgo9gki' }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/apple/
      - name: Publier la page
        if: always()
        run: |
          git config user.name "apple-bot"
          git config user.email "apple-bot@users.noreply.github.com"
          git add docs/apple data/apple_*.json
          git diff --cached --quiet || git commit -m "Mise à jour des produits Apple $(date -u +%F)"
          # le code a pu changer pendant la recherche : on se remet à jour avant de publier
          for essai in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
