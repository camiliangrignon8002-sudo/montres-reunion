name: Sonde Apple (temporaire)
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs séparées par des espaces (vide = liste par défaut)"
        default: ""
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python sonde_apple.py ${{ inputs.urls }}
