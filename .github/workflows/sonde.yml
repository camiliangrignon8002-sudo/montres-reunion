name: Sonde logements
on:
  push:
    branches: [sonde-logements]
    paths: [sonde/urls.txt, sonde/sonde.py]
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi
      - run: python sonde/sonde.py
      - run: |
          git config user.name "sonde-bot"; git config user.email "sonde-bot@users.noreply.github.com"
          git add sonde/pages && git commit -m "Résultats sonde" && git push
