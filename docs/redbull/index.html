<title>Index des canettes</title>
<meta name="description" content="Étude de design : chaque canette Red Bull en 3D, qui tourne sur elle-même. Projet de test non officiel.">
<meta name="theme-color" content="#050507">

<style>
:root{--c1:#1f3a93;--acc:#e3263a;--ink:#f4f4f6;--muted:#8d919a;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
html,body{margin:0;background:#050507;color:var(--ink);font-family:"Archivo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:4px;border-radius:6px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.spin{height:420vh}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
/* lumière de vitrine : projecteur en haut, sol sombre */
.light{position:absolute;inset:0;transition:opacity .5s;background:
  radial-gradient(46% 62% at 50% 6%, rgba(255,255,255,.26), color-mix(in srgb,var(--acc) 22%,transparent) 38%, transparent 72%),

.stage.focus .light{opacity:.35}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.fallback{position:absolute;left:50%;top:46%;height:64vh;transform:translate(-50%,-50%);display:none}
html.nogl .fallback{display:block}
.brand{position:absolute;top:22px;left:0;right:0;text-align:center;color:var(--muted);z-index:2}
.arrow{position:absolute;top:44%;z-index:3;width:60px;height:60px;margin-top:-30px;border-radius:50%;display:grid;place-items:center;color:#fff;border:1px solid rgba(255,255,255,.28);background:rgba(8,8,12,.45);transition:border-color .3s,transform .3s}
.arrow:hover{border-color:var(--acc)}
.arrow:hover{color:#fff;transform:scale(1.12)}
.arrow svg{width:26px;height:26px}
.arrow.prev{left:calc(50% - min(15vw,210px) - 30px)}
.arrow.next{right:calc(50% - min(15vw,210px) - 30px)}
.name{position:absolute;left:0;right:0;bottom:11vh;text-align:center;z-index:2;pointer-events:none}
.name b{display:block;font-weight:900;font-size:clamp(30px,4.2vw,60px);line-height:.88;letter-spacing:-.04em;text-transform:uppercase;transition:opacity .25s}
.name span{display:block;margin-top:12px;color:var(--muted)}
.track{position:absolute;left:50%;bottom:7vh;width:min(46vw,520px);height:3px;transform:translateX(-50%);border-radius:3px;z-index:2;
  background:linear-gradient(90deg,#3aa0dc,#1f3a93,#e8338f,#d0202e,#f07a1a,#f2c300,#4caf2f,#7cc8f2);opacity:.55}
.track i{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--ink);box-shadow:0 0 14px var(--acc);transition:left .45s cubic-bezier(.2,.8,.2,1)}
.hint{position:absolute;left:0;right:0;bottom:2.6vh;text-align:center;color:var(--muted);z-index:2;transition:opacity .4s}
.legal{position:absolute;left:16px;bottom:12px;color:rgba(255,255,255,.28);font-size:10px;letter-spacing:.06em;z-index:2;max-width:300px}
@media (max-width:760px){
  .arrow{top:44%}
  .arrow.prev{left:6px}.arrow.next{right:6px}
  .name{bottom:13vh}
  .track{width:70vw}
  .legal{display:none}
}
</style>
</head>
