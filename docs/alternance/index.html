<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alternance 974</title>
<meta name="description" content="Toutes les offres d'alternance et d'emploi à La Réunion : apprentissage, contrat pro, CDI, CDD, intérim, contacts, carte, CV et lettre de motivation.">
<meta name="theme-color" content="#0b6e4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Alternance 974">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{
  --fond:#fff;--carte:#f4f4f4;--texte:#1a1a1a;--doux:#6b6b6b;--ligne:#e6e6e6;--champ:#f4f4f4;
  --vert:#127749;--vert-doux:#e8f2ec;--orange:#b25000;--orange-doux:#fdf0e3;--bleu:#1f5fbf;--bleu-doux:#e6eefb;
  --rouge:#d1242f;--ombre:none;--r:6px;
}
@media (prefers-color-scheme:dark){:root{
  --fond:#000;--carte:#151515;--texte:#f2f2f2;--doux:#9a9a9a;--ligne:#262626;--champ:#151515;
  --vert:#4cc38a;--vert-doux:#0f2a1d;--orange:#ff9f0a;--orange-doux:#33210a;--bleu:#6ea8ff;--bleu-doux:#14243d;
  --rouge:#ff6b6b;--ombre:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fond);color:var(--texte);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:calc(40px + env(safe-area-inset-bottom));overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--vert);text-decoration:none}
[hidden]{display:none!important}
svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
svg.ic.p{width:16px;height:16px;vertical-align:-3px}
svg.ic.plein{fill:currentColor}
.rond svg.ic{width:21px;height:21px}
.page{max-width:1000px;margin:auto;padding:0 16px}

header{position:sticky;top:0;z-index:30;background:var(--fond);border-bottom:1px solid var(--ligne);padding:calc(env(safe-area-inset-top) + 10px) 0 8px}
.haut{display:flex;align-items:center;gap:6px}
.haut h1{flex:1;min-width:0;margin:0 0 0 4px;font-size:22px;font-weight:700;letter-spacing:-.01em}
.haut h1 small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;font-weight:400;color:var(--doux);letter-spacing:0}
.rond{border:0;width:40px;height:40px;border-radius:50%;background:transparent;color:var(--texte);display:grid;place-items:center;flex:none;font-size:19px}
.rond:active{transform:scale(.94)}
.tourne{animation:tourne .8s linear infinite}@keyframes tourne{to{transform:rotate(360deg)}}
.cherche{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--champ);border-radius:12px;padding:0 12px}
.cherche input{flex:1;border:0;background:transparent;padding:11px 0;outline:none;min-width:0}
.puces{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.puces::-webkit-scrollbar{display:none}
.puce{border:1px solid var(--ligne);background:var(--fond);border-radius:999px;padding:7px 14px;white-space:nowrap;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.puce.actif{background:var(--vert);border-color:var(--vert);color:#fff}

.autour{background:var(--carte);border-radius:var(--r);padding:16px 18px;margin:14px 0}
.autour .ligne{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.autour select{flex:1;min-width:150px;border:1px solid var(--ligne);background:var(--fond);border-radius:10px;padding:8px}
.btn{border:0;border-radius:999px;padding:10px 14px;background:var(--vert);color:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.leger{background:var(--vert-doux);color:var(--vert)}
.btn.gris{background:var(--fond);color:var(--texte);border:1px solid var(--ligne)}
.btn:active{transform:scale(.97)}
input[type=range]{width:100%;accent-color:var(--vert);margin:10px 0 2px}
.aide{font-size:13px;color:var(--doux)}

.vues{display:flex;border-bottom:1px solid var(--ligne);margin:8px 0 12px}
.vues button{flex:1;border:0;background:transparent;padding:10px;font-weight:500;color:var(--doux);border-bottom:2px solid transparent;margin-bottom:-1px}
.vues button.actif{color:var(--texte);border-bottom-color:var(--vert);font-weight:600}
.compte{font-size:14px;color:var(--doux);margin:4px 2px 10px}

.liste{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
@media (max-width:400px){.liste{grid-template-columns:1fr}}
@media (max-width:520px){.offre{grid-template-columns:1fr 84px!important;padding:22px 16px 20px 22px!important;min-height:0!important}.offre .dessin svg{width:72px!important;height:72px!important}.offre h3{font-size:19px!important}}
.offre{position:relative;background:var(--carte);border-radius:var(--r);padding:26px 22px 24px 26px;cursor:pointer;display:grid;grid-template-columns:1fr 112px;gap:14px;align-items:center;min-height:230px;transition:background .15s}
.offre:hover{background:#efefef}
@media (prefers-color-scheme:dark){.offre:hover{background:#1c1c1c}}
.offre:focus-visible{outline:2px solid var(--vert);outline-offset:2px}
.offre .txt{display:flex;flex-direction:column;gap:5px;min-width:0;padding-top:30px}
.offre h3{margin:0;font-size:21px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.offre .sous{font-size:15.5px;color:var(--doux);line-height:1.35}
.offre .meta{font-size:15px;color:var(--texte);margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.offre .quand{font-size:13.5px;color:var(--doux)}
.offre .neuf{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--vert)}
.offre .fav{position:absolute;top:20px;left:20px;border:0;background:none;color:var(--vert);padding:6px;border-radius:50%}
.offre .fav svg.ic{width:22px;height:22px}
.offre .dessin{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--vert)}
.offre .dessin svg{width:92px;height:92px;stroke-width:1.1;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.offre .dessin i{display:block;width:70px;height:10px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.14),transparent 70%)}
@media (prefers-color-scheme:dark){.offre .dessin i{background:radial-gradient(rgba(255,255,255,.08),transparent 70%)}}
.offre .info{display:inline-grid;place-items:center;width:20px;height:20px;border:1.4px solid currentColor;border-radius:50%;font:italic 600 12px Georgia,serif}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--fond);border:1px solid var(--ligne);color:var(--doux);display:inline-flex;align-items:center;gap:4px}
.tag.neuf{background:var(--rouge);color:#fff}
.tag.spont{background:var(--orange-doux);color:var(--orange)}
.tag.off{background:var(--bleu-doux);color:var(--bleu)}
.tag.ok{background:var(--vert-doux);color:var(--vert)}
.section{display:flex;gap:6px;margin-top:10px}
.section button{flex:1;border:1px solid var(--ligne);background:var(--fond);border-radius:999px;padding:9px 6px;font-weight:600;color:var(--doux);font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.section button.actif{background:var(--vert);border-color:var(--vert);color:#fff}
.puces.dom .puce{font-size:13px;padding:6px 11px}
.puce b{font-weight:600;opacity:.7;margin-left:4px}
#tirer{color:var(--vert);position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translate(-50%,-60px);z-index:40;background:var(--carte);box-shadow:var(--ombre);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-size:19px;transition:transform .15s}
.qualites{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.qualites .puce{font-size:13.5px}
#lm-texte{min-height:340px;font-family:Georgia,"Times New Roman",serif;font-size:15px;line-height:1.5}
.vide{text-align:center;color:var(--doux);padding:48px 20px;background:var(--carte);border-radius:var(--r);grid-column:1/-1}
#carte{height:calc(100vh - 330px);min-height:360px;border-radius:var(--r);overflow:hidden;box-shadow:var(--ombre);z-index:1}
.leaflet-popup-content{font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.leaflet-popup-content b{display:block}
.leaflet-popup-content button{margin-top:6px;border:0;border-radius:8px;background:#0b6e4f;color:#fff;padding:6px 10px;font-weight:600}

/* Feuilles (fiche, CV, menu) */
.voile{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.feuille{background:var(--fond);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom));animation:monte .22s ease-out}
@keyframes monte{from{transform:translateY(40px);opacity:.5}}
@media (min-width:760px){.voile{align-items:center}.feuille{border-radius:22px;max-height:88vh}}
.feuille .barre{display:flex;align-items:center;gap:10px;margin-bottom:8px;min-height:40px}
.feuille .barre h2{flex:1;margin:0;font-size:20px;line-height:1.25}
.bloc{background:var(--carte);border-radius:var(--r);padding:18px;margin:10px 0}
.bloc h4{margin:0 0 8px;font-size:15px}
.bloc p{margin:0 0 6px;white-space:pre-line}
.bloc ul{margin:0;padding-left:20px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .large{grid-column:1/-1}
.infos{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14.5px}
.infos dt{color:var(--doux)}.infos dd{margin:0}
.hero{background:var(--carte);border-radius:var(--r);padding:24px 20px 22px 24px;display:grid;grid-template-columns:1fr 96px;gap:12px;align-items:center}
.hero .txt{display:flex;flex-direction:column;gap:5px;min-width:0}
.hero h2{margin:0;font-size:24px;line-height:1.2;letter-spacing:-.01em}
.hero .sous{color:var(--doux);font-size:15.5px}
.hero .meta{font-size:15px;margin-top:4px}
.hero .neuf{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--vert)}
.hero .dessin{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--vert)}
.hero .dessin svg{width:80px;height:80px;stroke-width:1.1;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.hero .dessin i{display:block;width:60px;height:9px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.14),transparent 70%)}
.desc{white-space:pre-line;line-height:1.6;font-size:15.5px}
.bloc ul{line-height:1.6}
.carte-map{width:100%;height:220px;border:0;border-radius:12px;margin-top:10px}
.replie{max-height:9.5em;overflow:hidden;position:relative}
.replie::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3em;background:linear-gradient(transparent,var(--carte))}
.lien-plus{border:0;background:none;color:var(--vert);font-weight:600;padding:4px 0}
label.champ{display:block;margin:8px 0;font-size:14px;color:var(--doux)}
label.champ input,label.champ textarea,label.champ select{display:block;width:100%;margin-top:4px;border:1px solid var(--ligne);background:var(--carte);border-radius:10px;padding:10px;color:var(--texte)}
textarea{min-height:170px;resize:vertical}
.cv-etat{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--vert-doux);color:var(--vert);font-weight:600}
.cv-etat.manque{background:var(--orange-doux);color:var(--orange)}
.menu a,.menu button.entree{display:flex;align-items:center;gap:12px;width:100%;padding:13px 4px;border:0;border-bottom:1px solid var(--ligne);background:none;text-align:left;color:var(--texte)}
.menu svg.ic{width:22px;height:22px;margin:0 4px;color:var(--vert)}
.cand{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ligne)}
.cand div{flex:1;min-width:0}
.cand small{color:var(--doux)}
.cand select{border:1px solid var(--ligne);background:var(--champ);border-radius:8px;padding:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#16201b;color:#fff;padding:11px 16px;border-radius:12px;z-index:90;max-width:90vw;font-size:14.5px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
</style>
</head>

e paie. * Participer à la mise en œuvre du plan de développement des compétences : recueil des besoins, organisation des formations, coordination avec les organismes et suivi administratif des actions. * Participer aux relations sociales : organisation des élections professionnelles, préparation des réunions avec les représentants du personnel et suivi des dossiers disciplinaires. * Assurer le suivi des indicateurs RH : mettre à jour les tableaux de bord et suivre les effectifs, les absences et les mouvements du personnel. * Accompagner les collaborateurs et les managers au quotidien : répondre aux demandes RH courantes et veiller à l'application des procédures internes. Titulaire d'une formation en ressources humaines, vous justifiez d'une première expérience sur un poste similaire. Organisé, rigoureux et réactif, vous savez gérer vos priorités et travailler en autonomie. Doté d'un bon relationnel, vous aimez le travail en équipe, êtes à l'écoute des collaborateurs et savez faire preuve de discrétion. Votre sens du service, votre esprit d'initiative et votre capacité à vous adapter à un environnement dynamique vous permettront de contribuer pleinement à la vie du magasin. Le poste est à pourvoir en CDI, dès que possible, et sera basé à Matoury.", "a_apprendre": [], "attendu": [], "niveau": "", "contrats": ["Intérim"], "debut": "", "duree": "", "teletravail": "", "postes": null, "salaire": "1900 € – 2000 €/mois", "adresse": "97351, Matoury", "commune": "La Réunion", "lat": null, "lon": null, "tel": "", "email": "", "site": "", "postuler": "https://www.domtomemploi.fr/offres-emploi/assistant-ressources-humaines-hf-francetravail-8369206", "source": "Domtomemploi", "publie": "2026-10-29", "domaine": "Gestion, administration", "id": "url:https://www.domtomemploi.fr/offres-emploi/assistant-ressources-humaines-hf-francetravail-8369206", "vu": "2026-10-29T08:26+04:00"}, {"categorie": "emploi", "type": "offre", "titre": "COMPTABLE GENERAL (H/F)", "entreprise": "GBH", "secte memploi.fr/offres-emploi/comptable-general-hf-francetravail-8369200", "source": "Domtomemploi", "publie": "2026-10-29", "position_approx": true, "domaine": "Gestion, administration", "id": "url:https://www.domtomemploi.fr/offres-emploi/comptable-general-hf-francetravail-8369200", "vu": "2026-10-29T08:26+04:00"}, {"categorie": "emploi", "type": "offre", "titre": "Conducteur de Travaux Photovoltaïque (H/F)", "entreprise": "Storme RH", "secteur": "", "taille": "", "description": "DESCRIPTION Votre quotidien Vous prenez le relais des équipes commerciales dès la signature du contrat et devenez l'interlocuteur privilégié du client pour l'organisation et la réalisation de son installation photovoltaïque. Votre première mission consiste à sécuriser la préparation technique des chantiers. Vous réalisez les visites sur site, effectuez les métrés, analysez les pans et l'état des toitures, vérifiez les contraintes techniques et électriques et validez avec le client l'implantation des équipements et de la zone technique. Vous organisez ensuite les interventions : préparation du matériel nécessaire, planification des chantiers et coordination avec le chef d'équipe chargé de leur exécution. Durant les travaux, vous veillez au bon déroulement des opérations, anticipez les difficultés et apportez les solutions nécessaires pour respecter les exigences techniques, la qualité d'installation et les délais prévus. Autonome dans la gestion de vos chantiers, vous assurez leur suivi jusqu'à la réception et maintenez une communication régulière avec les clients. Présent sur le terrain, vous pouvez ponctuellement apporter votre aide aux équipes, mais votre rôle reste avant tout celui d'un organisateur et d'un coordinateur de travaux. Le suivi administratif demeure limité. EXIGENCES Vous justifiez d'une expérience en conduite de travaux et d'une connaissance opérationnelle impérative du photovoltaïque. Vous maîtrisez les contraintes liées aux installations solaires, savez évaluer la faisabilité technique d'un chantier et disposez de solides connaissances en électricité et en environnement toiture. Vous êtes capable de préparer et planifier plusieurs interventions, de coordonner les équipes et de prendre des décisions opérationnelles en autonomie. Votre sens du contact est essentiel : vous savez expliquer les choix techniques, rassurer les clients et gérer les imprévus avec professionnalisme. Rigueur technique, organisation et réactivité seront vos meilleurs atouts pour réussir.", "a_apprendre": [], "attendu": [], "niveau": "", "contrats": ["Emploi"], "debut": "", "duree": "", "teletravail": "", "postes": null, "salaire": "30000 € – 35000 €/an", "adresse": "97438, Sainte-Marie", "commune": "Sainte-Marie", "lat": -20.8969, "lon": 55.5495, "tel": "", "email": "", "site": "", "postuler": "https://www.domtomemploi.fr/offres-emploi/conducteur-de-travaux-photovoltaique-hf-francetravail-8369153", "source": "Domtomemploi", "publie": "2026-10-29", "position_approx": true, "domaine": "BTP, construction", "id": "url:https://www.domtomemploi.fr/offres-emploi/conducteur-de-travaux-photovoltaique-hf-francetravail-8369153", "vu": "2026-10-29T08:26+04:00"}, {"categorie": "emploi", "type": "offre", "titre": "Formateur / Manager Polyvalent (H/F)", "entreprise": "Entreprise non communiquée", "secteur": "", "taille": "", "description": "Le métier de manager de restaurant au sein de POKYA, s'articule autour de 3 activités : former, gérer, vendre. Son rôle est de contrôler la production, suivre les stocks, superviser les emplois du temps. Ce dernier effectue dans le même temps les missions de production des équipiers polyvalents détaillées dans la fiche de poste des équipiers polyvalents. Il veille à la qualité de l'accueil et du service, dans le respect des normes édictées par la maison-mère. Il doit être aussi à l'aise avec la clientèle qu'avec son équipe. Il règle les éventuels litiges, dialogue avec les clients pour recueillir leurs avis et suggestions, entretient une ambiance conviviale. Le formateur de restaurant est sous la responsabilité du Gérant de restaurant. Le formateur de restaurant; Définit le planning des employés (serveurs, équipiers, ...) Forme l'équipe sur les réassorts, les mise en place du restaurant, les ouvertures et fermetures, les procédures Gère le stock ainsi que les ruptures Surveille l'activité des équipes et vérifie l'application des procédures qualité, des règles de sécurité et d'hygiène. Fidélise et s'assure de la satisfaction de la clientèle S'engage à effectuer un minimum de 2 ouvertures et 2 fermetures dans une semaine de travail Applique la politique commerciale de l'établissement Réalise la vente de produits de restauration, de services Repère les besoins en approvisionnement, passe les commandes de la PLV et co-suit l'état des stocks alimentaire avec le cuisinier Vérifie les produits (qualité, quantité, état) à la livraison et surveille le rangement et le stockage (chambre froide, congélateur, ...) Choisit des prestataires/fournisseurs, négocie les conditions du contrat et surveille la réalisation des produits, de l'intervention sur la PLV du restaurant Effectue le comptage des fonds de caisses Cette liste n'est pas exhaustive et n'est donnée qu'à titre indicatif. Le collaborateur pourra être amené à réaliser toute activité permettant de remplir la mission générale du poste. Il est porteur de l'esprit de polyvalence au sein de l'établissement. Type d'emploi : Temps plein, CDI Rémunération : 1 700,00€ à 2 000,00€ par mois Formation: * Baccalauréat / Niveau bac (Optionnel) Lieu du poste : En présentiel", "a_apprendre": [], "attendu": [], "niveau": "", "contrats": ["Emploi"], "debut": "", "duree": "", "teletravail": "", "postes": null, "salaire": "", "adresse": "97439, Sainte-Rose", "commune": "Sainte-Rose", "lat": -21.1273, "lon": 55.7963, "tel": "", "email": "", "site": "", "postuler": "https://www.domtomemploi.fr/offres-emploi/formateur-manager-polyvalent-hf-francetravail-8368796", "source": "Domtome oi/magasinier-fh-placidom-saint-pierre-francetravail-8367769", "vu": "2026-10-29T08:26+04:00"}, {"categorie": "emploi", "type": "offre", "titre": "Médiateur social (H/F)", "entreprise": "Entreprise non communiquée", "secteur": "", "taille": "", "description": "Le médiateur interculturel a pour mission de favoriser l'accès aux soins, aux droits et à la réduction des risques des personnes en situation de précarité et d'addictions, en tenant compte des spécificités culturelles, linguistiques et sociales des publics accompagnés. Ce poste transversal est réparti entre le CAARUD Mamio et le CSAPA. Missions communes aux deux établissements 1. Médiation interculturelle - Assurer la traduction linguistique et culturelle des codes administratifs, médicaux et sociaux. - Adapter les messages de réduction des risques et de santé aux représentations culturelles des publics. - Sensibiliser les équipes aux spécificités culturelles des publics accueillis. 2. Gestion des situations complexes - Désamorcer les conflits et gérer les situations d'agitation ou de crise. - Repérer les situations de vulnérabilité (violences, troubles psychiatriques, etc.) et signaler en interne si nécessaire. - Créer un climat de confiance et de sécurité, en veillant à ce que l'établissement reste convivial et apaisé. 3. Travail en équipe, observation et transmission - Collaborer étroitement avec les autres professionnels et participer aux réunions d'équipe. - Observer les besoins, difficultés et évolutions des personnes accompagnées et transmettre les informations utiles, dans le cadre du secret partagé. - Rédiger les comptes-rendus et écrits professionnels (dossier patient informatisé, logiciel éO, reporting réseau Addicto). - Contribuer au travail en réseau avec les partenaires sociaux et sanitaires. Missions spécifiques par établissement Au CAARUD Mamio - 0,5 ETP - Informer sur les modes de consommation à moindre risque et sensibiliser aux risques infectieux (VIH, VHB, VHC). - Promouvoir le dépistage et }

      <label class="champ">Type<select id="lm-categorie"><option value="alternance">Alternance</option><option value="emploi" ${o.categorie === "emploi" ? "selected" : ""}>Emploi (CDI, CDD…)</option></select></label>
      <label class="champ">Domaine<select id="lm-domaine"><option value="">—</option>${Object.keys(METIER).map(d => `<option ${d === o.domaine ? "selected" : ""}>${esc(d)}</option>`).join("")}</select></label>
      <label class="champ">Accords<select id="lm-genre"><option value="">motivé(e)</option><option value="f" ${LM.genre === "f" ? "selected" : ""}>au féminin (motivée)</option><option value="m" ${LM.genre === "m" ? "selected" : ""}>au masculin (motivé)</option></select></label>
      <div id="lm-alt">
        ${champ("formation", "Formation préparée (ex. BTS MCO, CAP cuisine)", LM.formation || PROFIL.formation)}
        ${champ("ecole", "École ou CFA (ex. CFA de Saint-Pierre)", LM.ecole)}
        ${champ("rythme", "Rythme (ex. 2 semaines en entreprise, 1 semaine en cours)", LM.rythme)}
      </div>
      ${champ("debut", "Disponible à partir du", LM.debut, 'type="date"')}
      ${champ("commune", "Ma commune", LM.commune || (POS && COMMUNES[POS.nom] ? POS.nom : ""), 'list="lm-communes"')}
      <datalist id="lm-communes">${Object.keys(COMMUNES).map(c => `<option value="${esc(c)}">`).join("")}</datalist>
      <label class="champ">Mes qualités (3 ou 4)</label>
      <div class="qualites" id="lm-qualites">${QUALITES.map(([m, f]) => `<button class="puce ${LM.qualites.includes(m) ? "actif" : ""}" data-q="${esc(m)}">${esc(LM.genre === "f" ? f : m)}</button>`).join("")}</div>
      <label class="champ">Mes expériences (stages, jobs d'été, bénévolat, sport…)<textarea id="lm-experiences" style="min-height:70px">${esc(LM.experiences)}</textarea></label>
      <label class="champ">Pourquoi cette entreprise ? (facultatif)<textarea id="lm-pourquoi" style="min-height:60px">${esc(LM.pourquoi)}</textarea></label>
      ${PROFIL.prenom ? "" : `<p class="aide">Astuce : ton nom, ton téléphone et ton email viennent de « Mon CV » (bouton ${ic("doc", "p")} en haut).</p>`}
    </div>
    <div class="bloc"><h4>Ta lettre</h4>
      <textarea id="lm-texte"></textarea>
      <div class="actions" style="margin-top:10px">
        <button class="btn gris" id="lm-autre">${ic("maj")} Autre version</button>
        <button class="btn gris" id="lm-copier">${ic("copier")} Copier</button>
        <button class="btn gris" id="lm-pdf">${ic("imprimante")} PDF / imprimer</button>
        <button class="btn gris" id="lm-partager">${ic("partager")} Partager</button>
        ${a ? `<button class="btn large" id="lm-ok">${ic("coche")} Garder pour cette offre</button>` : `<button class="btn large" id="lm-defaut">${ic("coche")} Utiliser comme message d'envoi du CV</button>`}
      </div>
      <p class="aide" id="lm-aide" style="margin-top:8px">${a && LETTRES[a.id] ? "Lettre déjà gardée pour cette offre : elle partira avec ton CV." : ""}</p>
    </div>`);
  const t = $("#lm-texte");
  let modifiee = false;
  const lireChamps = () => {
    for (const k of ["formation", "ecole", "rythme", "debut", "commune", "experiences", "pourquoi", "genre"]) LM[k] = $("#lm-" + k).value.trim();
    Object.assign(o, {poste: $("#lm-poste").value.trim(), entreprise: $("#lm-entreprise").value.trim() || "votre entreprise",
      categorie: $("#lm-categorie").value, domaine: $("#lm-domaine").value});
    if (!a) Object.assign(LM, {poste: o.poste, entreprise: $("#lm-entreprise").value.trim(), domaine: o.domaine});
    $("#lm-alt").hidden = o.categorie === "emploi";
    ecrire("alt974-lm", LM);
  };
  const regen = () => { lireChamps(); t.value = ecrireLettre(o); modifiee = false; };
  if (a && LETTRES[a.id]) { lireChamps(); t.value = LETTRES[a.id]; } else regen();
  $("#feuille").querySelectorAll("input,select,textarea:not(#lm-texte)").forEach(c => c.addEventListener("input", () => {
    if (modifiee && !confirm("Tu as modifié la lettre à la main. La réécrire avec les nouvelles infos ?")) { lireChamps(); return; }
    regen();
    if (c.id === "lm-genre") $("#lm-qualites").querySelectorAll("[data-q]").forEach(b => b.textContent = LM.genre === "f" ? QUALITES.find(q => q[0] === b.dataset.q)[1] : b.dataset.q);
  }));
  t.oninput = () => { modifiee = true; };
  $("#lm-qualites").onclick = e => {
    const b = e.target.closest("[data-q]"); if (!b) return;
    const q = b.dataset.q, i = LM.qualites.indexOf(q);
    if (i >= 0) LM.qualites.splice(i, 1); else if (LM.qualites.length >= 5) return toast("5 qualités au plus"); else LM.qualites.push(q);
    b.classList.toggle("actif", i < 0); regen();
  };
  $("#lm-autre").onclick = () => { LM.variante++; regen(); };
  $("#lm-copier").onclick = async () => { try { await navigator.clipboard.writeText(t.value); toast("Lettre copiée"); } catch (e) { t.select(); toast("Sélectionne et copie le texte"); } };
  $("#lm-pdf").onclick = () => {
    const f = document.createElement("iframe"); f.style.cssText = "position:fixed;width:0;height:0;border:0";
    f.srcdoc = `<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Lettre de motivation</title><style>@page{margin:2.2cm}body{font:12pt/1.55 Georgia,"Times New Roman",serif;color:#000;white-space:pre-wrap}</style></head><body>${esc(t.value)}</body></html>`;
    f.onload = () => { f.contentWindow.focus(); f.contentWindow.print(); setTimeout(() => f.remove(), 60000); };
    document.body.append(f);
    toast("Choisis « Enregistrer en PDF » pour garder la lettre");
  };
  $("#lm-partager").onclick = async () => {
    if (navigator.share) { try { await navigator.share({title: "Lettre de motivation", text: t.value}); } catch (e) {} }
    else { try { await navigator.clipboard.writeText(t.value); toast("Partage indisponible : lettre copiée"); } catch (e) {} }
  };
  const ok = $("#lm-ok"); if (ok) ok.onclick = () => { LETTRES[a.id] = t.value; ecrire("alt974-lettres", LETTRES); toast("Lettre gardée : elle partira avec ton CV"); fiche(a.id); };
  const def = $("#lm-defaut"); if (def) def.onclick = () => {
    let modele = t.value;
    if (o.entreprise && o.entreprise !== "votre entreprise") modele = modele.split(o.entreprise).join("{entreprise}");
    if (o.poste) modele = modele.split(o.poste).join("{poste}");
    PROFIL.lettre = modele; ecrire("alt974-profil", PROFIL);
    toast("Ce message accompagnera ton CV (nom de l'entreprise et poste remplacés à chaque envoi)");
  };
}

/* ---------- notifications (Web Push) ---------- */
const VAPID = "BELW2vkzh_ExmwyQlA4tQNi6rSXtBDZPDX2i1g-mXCFM2n5sHz6Rw4y065ax3IUcMbcmlRtCNEeXtWAVgpsAsbE", TOPIC = "alternance974-k3v8qz2m-abonnements";
let SW = null;
let NOTIF = Object.assign({actif: false, sections: ["alternance", "emploi"], spontanees: false, domaines: []}, lire("alt974-notif", {}));
const cleVapid = b => Uint8Array.from(atob(b.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - b.length % 4) % 4)), c => c.charCodeAt(0));
const iosHorsAppli = /iPhone|iPad|iPod/.test(navigator.userAgent) && !navigator.standalone && !matchMedia("(display-mode: standalone)").matches;
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").then(r => { SW = r; if (navigator.clearAppBadge) navigator.clearAppBadge().catch(() => {}); }).catch(() => {});

async function deposer(abo, stop) {
  // lieu arrondi (~1 km) : seul le rayon compte pour choisir les offres
  const choix = {sections: NOTIF.sections, spontanees: NOTIF.spontanees, domaines: NOTIF.domaines,
    ...(POS && F.rayon < 70 ? {lat: +POS.lat.toFixed(2), lon: +POS.lon.toFixed(2), rayon: F.rayon, lieu: POS.nom} : {rayon: 70})};
  const r = await fetch("https://ntfy.sh/" + TOPIC, {method: "POST", body: JSON.stringify(stop ? {abo, stop: true} : {abo, choix})});
  if (!r.ok) throw new Error(r.status);
}
async function activerNotifs() {
  if (iosHorsAppli) return toast("Sur iPhone : installe d'abord l'appli (Partager → Sur l'écran d'accueil), puis ouvre-la depuis l'icône");
  if (!("PushManager" in window) || !("Notification" in window)) return toast("Ce navigateur ne gère pas les notifications");
  if (!SW) SW = await navigator.serviceWorker.ready;
  if (await Notification.requestPermission() !== "granted") return toast("Notifications refusées : autorise-les dans les réglages du téléphone");
  try {
    const abo = (await SW.pushManager.getSubscription()) || await SW.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: cleVapid(VAPID)});
    await deposer(abo.toJSON ? abo.toJSON() : abo, false);
    NOTIF.actif = true; ecrire("alt974-notif", NOTIF);
    toast("Notifications activées. Tu seras prévenu(e) des nouvelles offres");
  } catch (e) { toast("Activation impossible pour l'instant, réessaie plus tard"); }
  panneauNotifs();
}
async function couperNotifs() {
  try {
    const abo = SW && await SW.pushManager.getSubscription();
    if (abo) { await deposer(abo.toJSON(), true); await abo.unsubscribe(); }
  } catch (e) {}
  NOTIF.actif = false; ecrire("alt974-notif", NOTIF); toast("Notifications désactivées"); panneauNotifs();
}
function panneauNotifs() {
  const doms = Object.keys(METIER);
  const coche = (id, on, t) => `<label style="display:flex;gap:10px;align-items:center;padding:8px 0"><input type="checkbox" id="${id}" ${on ? "checked" : ""} style="width:20px;height:20px;accent-color:var(--vert)">${t}</label>`;
  ouvrir(`${barre(`${ic("cloche")} Notifications`)}
    <div class="bloc">
      <div class="cv-etat ${NOTIF.actif ? "" : "manque"}">${NOTIF.actif ? `${ic("coche")} Notifications activées` : "Notifications désactivées"}</div>
      <p class="aide" style="margin-top:8px">Une notification arrive sur ton téléphone dès qu'une nouvelle offre qui te correspond est publiée (une recherche toutes les 5 heures).</p>
      ${iosHorsAppli ? '<p class="aide"><b>Sur iPhone</b> : installe d\'abord l\'appli (bouton Partager → « Sur l\'écran d\'accueil »), puis ouvre-la depuis son icône pour activer les notifications.</p>' : ""}
    </div>
    <div class="bloc"><h4>Me prévenir pour</h4>
      ${coche("n-alt", NOTIF.sections.includes("alternance"), `${ic("toque")} Les offres d'alternance`)}
      ${coche("n-emp", NOTIF.sections.includes("emploi"), `${ic("mallette")} Les offres d'emploi (CDI, CDD, intérim…)`)}
      ${coche("n-spont", NOTIF.spontanees, "Les entreprises qui recrutent en candidature spontanée")}
      <label class="champ">Domaines (aucun choisi = tous)</label>
      <div class="qualites" id="n-doms">${doms.map(d => `<button class="puce ${NOTIF.domaines.includes(d) ? "actif" : ""}" data-d="${esc(d)}">${icDom(d)} ${esc(d)}</button>`).join("")}</div>
      <p class="aide">Lieu : ${POS && F.rayon < 70 ? `dans un rayon de ${F.rayon} km autour de ${esc(POS.nom)}` : "toute l'île"} (réglable dans « Ma position » sur l'accueil).</p>
    </div>
    <div class="actions">
      <button class="btn large" id="n-ok">${NOTIF.actif ? "Enregistrer mes choix" : `${ic("cloche")} Activer les notifications`}</button>
      ${NOTIF.actif ? '<button class="btn gris large" id="n-stop">Désactiver</button>' : ""}
    </div>`);
  const lireChoix = () => {
    NOTIF.sections = [$("#n-alt").checked && "alternance", $("#n-emp").checked && "emploi"].filter(Boolean);
    NOTIF.spontanees = $("#n-spont").checked; ecrire("alt974-notif", NOTIF);
  };
  $("#n-doms").onclick = e => { const b = e.target.closest("[data-d]"); if (!b) return; const i = NOTIF.domaines.indexOf(b.dataset.d); i >= 0 ? NOTIF.domaines.splice(i, 1) : NOTIF.domaines.push(b.dataset.d); b.classList.toggle("actif", i < 0); ecrire("alt974-notif", NOTIF); };
  $("#n-ok").onclick = () => { lireChoix(); if (!NOTIF.sections.length) return toast("Coche l'alternance, l'emploi, ou les deux"); activerNotifs(); };
  const st = $("#n-stop"); if (st) st.onclick = couperNotifs;
}

];
function panneauCandidatures() {
  const l = Object.entries(CAND).sort((x, y) => y[1].date.localeCompare(x[1].date));
  const statuts = ["Envoyée", "Relancée", "Entretien", "Acceptée", "Refusée"];
  ouvrir(`${barre("Mes candidatures")}<div class="bloc">${l.length ? l.map(([id, c]) => `<div class="cand"><div><b>${esc(c.entreprise)}</b><br><small>${esc(c.titre)} · ${esc(date(c.date))}</small></div><select data-id="${esc(id)}">${statuts.map(s => `<option ${s === c.statut ? "selected" : ""}>${s}</option>`).join("")}</select></div>`).join("")
    : '<p class="aide">Aucune candidature notée. Dans une fiche, touche « J\'ai postulé » ou « Envoyer mon CV ».</p>'}</div>
    ${l.length ? `<p class="aide">Relance les entreprises sans réponse après une semaine environ.</p>` : ""}`);
  document.querySelectorAll(".cand select").forEach(s => s.onchange = () => { CAND[s.dataset.id].statut = s.value; ecrire("alt974-cand", CAND); });
  document.querySelectorAll(".cand div").forEach(d => d.onclick = () => { const id = d.nextElementSibling.dataset.id; if (OFFRES.find(a => a.id === id)) fiche(id); });
}

    ${AUSSI(F.section === "emploi" ? "" : "alternance").map(([n, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${ic("lien")}${esc(n)}</a>`).join("")}

/* ---------- actualiser ---------- */
let MAJ_EN_COURS = false, DERNIERE_MAJ = 0;
async function actualiser(silence) {
  if (MAJ_EN_COURS) return; MAJ_EN_COURS = true; DERNIERE_MAJ = Date.now();
  if (silence === true) {  // à l'ouverture et au retour sur l'appli : sans bruit
    try {
      const r = await fetch("annonces.json?t=" + Date.now(), {cache: "no-store"});
      if (r.ok) {
        const avant = new Set(OFFRES.map(a => a.id)), liste = await r.json();
        if (Array.isArray(liste) && (liste.length !== OFFRES.length || liste.some(a => !avant.has(a.id)))) {
          const nouv = liste.filter(a => !avant.has(a.id)).length;
          OFFRES = liste; puces(); afficher();
          if (nouv && avant.size) toast(`${nouv} nouvelle${nouv > 1 ? "s" : ""} offre${nouv > 1 ? "s" : ""} ajoutée${nouv > 1 ? "s" : ""}`);
        }
      }
    } catch (e) {}
    MAJ_EN_COURS = false; return;
  }
  const b = $("#b-maj"); b.classList.add("tourne"); $("#tirer").classList.add("tourne");
  try {
    const r = await fetch("annonces.json?t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    const avant = new Set(OFFRES.map(a => a.id));
    OFFRES = await r.json();
    const nouv = OFFRES.filter(a => !avant.has(a.id)).length;
    puces(); afficher();
    toast(nouv ? `${nouv} nouvelle${nouv > 1 ? "s" : ""} offre${nouv > 1 ? "s" : ""}` : "Tout est à jour");
  } catch (e) { toast(navigator.onLine === false ? "Pas de connexion" : "Rechargement de la page…"); if (navigator.onLine !== false) setTimeout(() => location.reload(), 600); }
  b.classList.remove("tourne"); $("#tirer").classList.remove("tourne"); $("#tirer").style.transform = ""; MAJ_EN_COURS = false;
}
$("#b-maj").onclick = () => actualiser();
// mise à jour toute seule : à l'ouverture, au retour sur l'appli et toutes les 30 min
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - DERNIERE_MAJ > 5 * 60e3) actualiser(true); });
setInterval(() => { if (!document.hidden) actualiser(true); }, 30 * 60e3);
// tirer la page vers le bas pour actualiser
let tirY = null, tirD = 0;
addEventListener("touchstart", e => { tirY = scrollY <= 0 && $("#voile").hidden && !e.target.closest("#carte") ? e.touches[0].clientY : null; tirD = 0; }, {passive: true});
addEventListener("touchmove", e => {
  if (tirY == null) return;
  tirD = Math.max(0, e.touches[0].clientY - tirY);
  $("#tirer").style.transform = `translate(-50%, ${Math.min(tirD, 110) - 60}px) rotate(${tirD * 3}deg)`;
}, {passive: true});
addEventListener("touchend", () => { if (tirY == null) return; tirY = null; if (tirD > 90) actualiser(); else $("#tirer").style.transform = ""; });

$("#b-notif").onclick = panneauNotifs;
puces(); rayonUI(); afficher();
// ouverture depuis une notification : #id de l'offre
function depuisLien() { const id = decodeURIComponent(location.hash.slice(1)); const a = id && OFFRES.find(x => x.id === id); if (a) { F.section = a.categorie || "alternance"; puces(); afficher(); fiche(id); } }
addEventListener("hashchange", depuisLien); depuisLien();
actualiser(true);
</script>
