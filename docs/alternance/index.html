<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alternance 974</title>
<meta name="description" content="Toutes les offres d'alternance et d'emploi à La Réunion : apprentissage, contrat pro, CDI, CDD, intérim, contacts, carte, CV et lettre de motivation.">
<meta name="theme-color" content="#0b6e4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Alternance 974">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{
  --fond:#fff;--carte:#f4f4f4;--texte:#1a1a1a;--doux:#6b6b6b;--ligne:#e6e6e6;--champ:#f4f4f4;
  --vert:#127749;--vert-doux:#e8f2ec;--or:#a37e2c;--orange:#b25000;--orange-doux:#fdf0e3;--bleu:#1f5fbf;--bleu-doux:#e6eefb;
  --rouge:#d1242f;--ombre:none;--r:6px;
}
@media (prefers-color-scheme:dark){:root{
  --fond:#000;--carte:#151515;--texte:#f2f2f2;--doux:#9a9a9a;--ligne:#262626;--champ:#151515;
  --vert:#4cc38a;--vert-doux:#0f2a1d;--or:#c9a24a;--orange:#ff9f0a;--orange-doux:#33210a;--bleu:#6ea8ff;--bleu-doux:#14243d;
  --rouge:#ff6b6b;--ombre:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,a,.offre,label{touch-action:manipulation}
html{scroll-behavior:smooth}

html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fond);color:var(--texte);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:calc(40px + env(safe-area-inset-bottom));overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--vert);text-decoration:none}
[hidden]{display:none!important}
svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
svg.ic.p{width:16px;height:16px;vertical-align:-3px}
svg.ic.plein{fill:currentColor}
.onglets-bas button.actif[data-nav=favoris] svg.ic{fill:currentColor}
.rond svg.ic{width:21px;height:21px}
.page{max-width:1200px;margin:auto;padding:0 16px}

header.old{position:sticky;top:0;z-index:30;background:var(--fond);border-bottom:1px solid var(--ligne);padding:calc(env(safe-area-inset-top) + 10px) 0 8px}
.haut{display:flex;align-items:center;gap:6px}
.haut h1{flex:1;min-width:0;margin:0 0 0 4px;font-size:22px;font-weight:700;letter-spacing:-.01em}
.haut h1 small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;font-weight:400;color:var(--doux);letter-spacing:0}
.rond{border:0;width:40px;height:40px;border-radius:50%;background:transparent;color:var(--texte);display:grid;place-items:center;flex:none;font-size:19px}
.rond:active{transform:scale(.94)}
.tourne{animation:tourne .8s linear infinite}@keyframes tourne{to{transform:rotate(360deg)}}
.cherche{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--champ);border-radius:12px;padding:0 12px}
.cherche input{flex:1;border:0;background:transparent;padding:11px 0;outline:none;min-width:0}
.puces{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.puces::-webkit-scrollbar{display:none}
.puce{border:1px solid var(--ligne);background:var(--fond);border-radius:999px;padding:7px 14px;white-space:nowrap;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.puce.actif{background:var(--vert);border-color:var(--vert);color:#fff}

.autour{background:var(--carte);border-radius:var(--r);padding:16px 18px;margin:14px 0}
.autour .ligne{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.autour select{flex:1;min-width:150px;border:1px solid var(--ligne);background:var(--fond);border-radius:10px;padding:8px}
.btn{border:0;border-radius:999px;padding:10px 14px;background:var(--vert);color:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.leger{background:var(--vert-doux);color:var(--vert)}
.btn.gris{background:var(--fond);color:var(--texte);border:1px solid var(--ligne)}
.btn:active{transform:scale(.97)}
input[type=range]{width:100%;accent-color:var(--vert);margin:10px 0 2px}
.aide{font-size:13px;color:var(--doux)}

.vues{display:flex;border-bottom:1px solid var(--ligne);margin:8px 0 12px}
.vues button{flex:1;border:0;background:transparent;padding:10px;font-weight:500;color:var(--doux);border-bottom:2px solid transparent;margin-bottom:-1px}
.vues button.actif{color:var(--texte);border-bottom-color:var(--vert);font-weight:600}
.compte{font-size:14px;color:var(--doux);margin:4px 2px 10px}

.liste{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
@media (max-width:400px){.liste{grid-template-columns:1fr}}
@media (max-width:520px){.offre{grid-template-columns:1fr 84px!important;padding:22px 16px 20px 22px!important;min-height:0!important}.offre h3{font-size:19px!important}}
.offre{content-visibility:auto;contain-intrinsic-size:auto 280px;position:relative;background:var(--carte);border-radius:var(--r);padding:26px 22px 24px 26px;cursor:pointer;display:grid;grid-template-columns:1fr 112px;gap:14px;align-items:center;min-height:230px;transition:background .15s}
.offre:hover{background:#efefef}
.offre:active{transform:scale(.992);transition:transform .08s}
#suite{grid-column:1/-1;height:1px}
@media (prefers-color-scheme:dark){.offre:hover{background:#1c1c1c}}
.offre:focus-visible{outline:2px solid var(--vert);outline-offset:2px}
.offre .txt{display:flex;flex-direction:column;gap:5px;min-width:0;padding-top:30px}
.offre h3{margin:0;font-size:21px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.offre .sous{font-size:15.5px;color:var(--doux);line-height:1.35}
.offre .meta{font-size:15px;color:var(--texte);margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.offre .quand{font-size:13.5px;color:var(--doux)}
.offre .neuf{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--vert)}
.offre .fav{position:absolute;top:20px;left:20px;border:0;background:none;color:var(--vert);padding:6px;border-radius:50%}
.offre .fav svg.ic{width:22px;height:22px}
.offre .dessin,.hero .dessin{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--texte)}
.carre{width:78px;height:78px;border-radius:18px;background:var(--fond);display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04)}
.carre svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round}
.dessin i{display:block;width:22px;height:2px;border-radius:2px;background:var(--or)}
@media (max-width:520px){.offre .carre{width:64px;height:64px;border-radius:16px}.offre .carre svg{width:28px;height:28px}}
.offre .info{display:inline-grid;place-items:center;width:20px;height:20px;border:1.4px solid currentColor;border-radius:50%;font:italic 600 12px Georgia,serif}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--fond);border:1px solid var(--ligne);color:var(--doux);display:inline-flex;align-items:center;gap:4px}
.tag.neuf{background:var(--rouge);color:#fff}
.tag.spont{background:var(--orange-doux);color:var(--orange)}
.tag.off{background:var(--bleu-doux);color:var(--bleu)}
.tag.ok{background:var(--vert-doux);color:var(--vert)}
.section{display:flex;gap:6px;margin-top:10px}
.section button{flex:1;border:1px solid var(--ligne);background:var(--fond);border-radius:999px;padding:9px 6px;font-weight:600;color:var(--doux);font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.section button.actif{background:var(--vert);border-color:var(--vert);color:#fff}
.puces.dom .puce{font-size:13px;padding:6px 11px}
.puce b{font-weight:600;opacity:.7;margin-left:4px}
#tirer{color:var(--vert);position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translate(-50%,-60px);z-index:40;background:var(--carte);box-shadow:var(--ombre);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-size:19px;transition:transform .15s}
.qualites{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.qualites .puce{font-size:13.5px}
#lm-texte{min-height:340px;font-family:Georgia,"Times New Roman",serif;font-size:15px;line-height:1.5}
/* Bandeau, titre, onglets, filtres : style catalogue haut de gamme */
.bandeau{position:sticky;top:0;z-index:30;background:var(--fond);padding-top:env(safe-area-inset-top);transition:box-shadow .2s}
.bandeau.colle{box-shadow:0 1px 0 var(--ligne)}
.bandeau-in{max-width:1200px;margin:auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 16px}
.nu{border:0;background:none;color:var(--texte);width:44px;height:44px;display:grid;place-items:center;border-radius:50%;padding:0}
.nu svg.ic{width:24px;height:24px;stroke-width:1.7}
.nu.actif{color:var(--vert)}
.droite{display:flex;justify-content:flex-end;gap:2px}
@media (max-width:440px){.bandeau-in{padding:10px 8px}.nu{width:38px;height:38px}.nu svg.ic{width:22px;height:22px}.droite{gap:0}.embleme span{letter-spacing:.18em;font-size:10px}}
.embleme{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--or);text-decoration:none}
.embleme svg{width:50px;height:38px;filter:drop-shadow(0 3px 2.5px rgba(70,50,10,.28)) drop-shadow(0 1px 0 rgba(255,255,255,.4))}
.embleme .reflet{transform:skewX(-22deg);animation:reflet 5s cubic-bezier(.4,0,.2,1) 1s infinite}
@keyframes reflet{0%{transform:translateX(0) skewX(-22deg)}40%,100%{transform:translateX(120px) skewX(-22deg)}}

.embleme span{font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--texte);font-weight:600;margin-right:-.32em}
.embleme em{font-style:normal;font-size:8.5px;letter-spacing:.42em;text-transform:uppercase;color:var(--doux);margin-right:-.42em;position:relative;padding-top:7px}
.embleme em::before{content:"";position:absolute;top:0;left:50%;width:16px;height:1.5px;margin-left:-8px;background:var(--or);border-radius:2px}
.cherche{border-top:1px solid var(--ligne);margin:0;border-radius:0;background:var(--fond);padding:0;flex-direction:column;align-items:stretch;gap:0}
.cherche-in{width:100%}
.suggestions{max-width:1200px;margin:0 auto;width:100%}
.cherche-in{display:flex;align-items:center;gap:10px;padding:6px 16px}
.cherche input{font-size:17px;padding:12px 0}
.hero-page{text-align:center;padding:clamp(28px,6vw,64px) 0 8px}
.surtitre{font-size:clamp(14px,1.8vw,19px);letter-spacing:.18em;text-transform:uppercase;font-weight:500;margin-bottom:8px}
.hero-page h1{margin:0;font-size:clamp(40px,7.4vw,84px);line-height:1.02;font-weight:700;letter-spacing:-.025em}
.onglets{display:flex;justify-content:center;gap:clamp(12px,6vw,90px);margin-top:clamp(26px,4vw,48px)}
.onglets button{border:0;background:none;font-size:clamp(16px,1.6vw,19px);font-weight:600;padding:10px clamp(16px,4vw,60px) 14px;border-bottom:2px solid transparent;color:var(--texte)}
.onglets button.actif{color:var(--vert);border-bottom-color:var(--vert)}
.filtres{display:flex;align-items:center;gap:clamp(14px,3vw,40px);overflow-x:auto;scrollbar-width:none;padding:clamp(28px,4vw,52px) 2px 22px;white-space:nowrap}
.filtres::-webkit-scrollbar{display:none}
.filtres button{border:0;background:none;font-size:16px;font-weight:600;color:var(--texte);display:inline-flex;align-items:center;gap:6px;padding:6px 0;flex:none}
.filtres button.actif{color:var(--vert)}
.filtres .ressort{flex:1;min-width:10px}
.filtres svg.ic{width:18px;height:18px;stroke-width:2}
.compte{text-align:left;font-size:14px;color:var(--doux);margin:0 2px 14px}
.pied{text-align:center;color:var(--doux);font-size:13px;padding:48px 16px 20px;line-height:1.6}
.rail-dom{display:flex;gap:clamp(10px,2vw,22px);overflow-x:auto;scrollbar-width:none;padding:clamp(26px,4vw,44px) 2px 4px;scroll-snap-type:x proximity}
.rail-dom::-webkit-scrollbar{display:none}
.dom{flex:none;width:clamp(76px,8.4vw,98px);border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:10px;scroll-snap-align:start;color:var(--texte);padding:0}
.dom .carre{width:clamp(60px,6.4vw,74px);height:clamp(60px,6.4vw,74px);border-radius:18px;background:var(--carte);box-shadow:none;transition:background .2s,box-shadow .2s}
.dom .carre svg{width:clamp(24px,2.6vw,30px);height:clamp(24px,2.6vw,30px)}
.dom:hover .carre{background:#ececec}
.dom b{font-weight:500;font-size:12.5px;line-height:1.25;text-align:center;min-height:2.5em}
.dom i{display:block;width:18px;height:2px;border-radius:2px;background:var(--or);opacity:.8;transition:width .2s}
.dom.actif b{color:var(--vert);font-weight:600}
.dom.actif i{width:34px;opacity:1}
.dom.actif .carre{background:var(--fond);box-shadow:0 10px 26px rgba(0,0,0,.07),inset 0 0 0 1px var(--ligne)}
@media (prefers-color-scheme:dark){.dom:hover .carre{background:#1f1f1f}}
.offre .salaire{font-size:15px;font-weight:600;color:var(--texte)}
.offre .atout{font-size:13.5px;color:var(--vert);display:flex;align-items:center;gap:4px}
.offre .atout.bts{color:var(--or);font-weight:600}
.offre .atout.bts.doux{font-weight:500}
.offre.vue h3{color:#4a4a4a}
@media (prefers-color-scheme:dark){.offre.vue h3{color:#bdbdbd}}
.compte{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between}
.compte b{color:var(--vert);font-weight:600}
.lien-alerte{border:0;background:none;color:var(--vert);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;padding:4px 0}
.bascule{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ligne);cursor:pointer}
.bascule:last-child{border-bottom:0}
.bascule span{flex:1;display:flex;flex-direction:column}
.bascule small{color:var(--doux);font-size:13px}
.bascule input{position:absolute;opacity:0;pointer-events:none}
.bascule i{width:46px;height:28px;border-radius:14px;background:#d5d5d5;position:relative;transition:background .2s;flex:none}
.bascule i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.bascule input:checked + i{background:var(--vert)}
.bascule input:checked + i::after{transform:translateX(18px)}
.bascule input:focus-visible + i{outline:2px solid var(--vert);outline-offset:2px}
.segments{display:flex;border:1px solid var(--ligne);border-radius:999px;padding:3px;gap:2px;background:var(--fond)}
.segments button{flex:1;border:0;background:none;border-radius:999px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--doux)}
.segments button.actif{background:var(--vert);color:#fff}
.segments.six{display:grid;grid-template-columns:repeat(3,1fr);border-radius:18px}
@media (min-width:560px){.segments.six{grid-template-columns:repeat(6,1fr);border-radius:999px}}
.simu-res{display:flex;flex-direction:column;align-items:center;padding:18px 0 6px}
.simu-res span{font-size:30px;font-weight:700;letter-spacing:-.01em}
.simu-res small{color:var(--or);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px;margin-top:4px}
.alerte-arnaque{background:#fdf2f2;color:#8a1c1c}
@media (prefers-color-scheme:dark){.alerte-arnaque{background:#2a1212;color:#ffb4b4}}
.guide-acc{padding:56px 0 8px}
.guide-acc h2{text-align:center;font-size:clamp(28px,4vw,44px);letter-spacing:-.02em;margin:0 0 28px}
.guide-cartes{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.guide-cartes button{border:0;background:var(--carte);padding:28px 18px 24px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--texte);text-align:center}
.guide-cartes button:hover{background:#efefef}
@media (prefers-color-scheme:dark){.guide-cartes button:hover{background:#1c1c1c}}
.guide-cartes .carre{margin-bottom:8px}
.guide-cartes b{font-size:17px}
.guide-cartes small{color:var(--doux);font-size:14px}
.onglets-bas{display:none}
@media (max-width:760px){
  .onglets-bas{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.94);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--ligne);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .onglets-bas button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--doux);font-size:11px;font-weight:500;padding:4px 0;position:relative}
  .onglets-bas svg.ic{width:23px;height:23px;stroke-width:1.6}
  .onglets-bas button.actif{color:var(--vert)}
  .onglets-bas b{position:absolute;top:0;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--vert);color:#fff;font-size:10px;display:grid;place-items:center}
  .onglets-bas b:empty{display:none}
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .droite #b-loupe,.droite #b-favs{display:none}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}
@media (max-width:760px) and (prefers-color-scheme:dark){.onglets-bas{background:rgba(10,10,10,.92)}}
.actifs{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 14px}
.actifs:empty{display:none}
.actifs button{border:1px solid var(--ligne);background:var(--fond);border-radius:999px;padding:6px 10px 6px 13px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;color:var(--texte)}
.actifs button svg.ic{width:14px;height:14px;color:var(--doux)}
.actifs .tout{border:0;color:var(--vert);font-weight:600;padding-left:4px}
.suggestions{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px 12px}
.suggestions::-webkit-scrollbar{display:none}
.suggestions button{flex:none;border:1px solid var(--ligne);background:var(--fond);border-radius:999px;padding:7px 13px;font-size:14px;color:var(--texte)}
.suggestions:empty{display:none}
.espace{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.espace button{border:0;background:var(--carte);border-radius:18px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--texte);font-size:14.5px;font-weight:600}
.espace button small{color:var(--doux);font-weight:400;font-size:12.5px}
.espace .carre{width:56px;height:56px;border-radius:14px}
.espace .carre svg{width:26px;height:26px}
.opts{display:flex;flex-direction:column}
.opt{display:flex;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--ligne);background:none;padding:15px 4px;text-align:left;font-size:16px;color:var(--texte)}
.opt span{flex:1}
.opt small{color:var(--doux);font-size:14px}
.opt.actif{color:var(--vert);font-weight:600}
.opt svg.ic.marque{visibility:hidden}
.opt.actif svg.ic.marque{visibility:visible}
.offre,.hero{border-radius:0!important}
.vide{text-align:center;color:var(--doux);padding:48px 20px;background:var(--carte);border-radius:var(--r);grid-column:1/-1}
#carte{height:calc(100vh - 330px);min-height:360px;border-radius:var(--r);overflow:hidden;box-shadow:var(--ombre);z-index:1}
.leaflet-popup-content{font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.leaflet-popup-content b{display:block}
.leaflet-popup-content button{margin-top:6px;border:0;border-radius:8px;background:#0b6e4f;color:#fff;padding:6px 10px;font-weight:600}

/* Feuilles (fiche, CV, menu) */
.voile{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.feuille{background:var(--fond);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom));animation:monte .22s ease-out}
@keyframes monte{from{transform:translateY(40px);opacity:.5}}
@media (min-width:760px){.voile{align-items:center}.feuille{border-radius:22px;max-height:88vh}}
.feuille .barre{display:flex;align-items:center;gap:10px;margin-bottom:8px;min-height:40px}
.feuille .barre h2{flex:1;margin:0;font-size:20px;line-height:1.25}
.bloc{background:var(--carte);border-radius:var(--r);padding:18px;margin:10px 0}
.bloc h4{margin:0 0 8px;font-size:15px}
.bloc p{margin:0 0 6px;white-space:pre-line}
.bloc ul{margin:0;padding-left:20px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .large{grid-column:1/-1}
.infos{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14.5px}
.infos dt{color:var(--doux)}.infos dd{margin:0}
.hero{background:var(--carte);border-radius:var(--r);padding:24px 20px 22px 24px;display:grid;grid-template-columns:1fr 96px;gap:12px;align-items:center}
.hero .txt{display:flex;flex-direction:column;gap:5px;min-width:0}
.hero h2{margin:0;font-size:24px;line-height:1.2;letter-spacing:-.01em}
.hero .sous{color:var(--doux);font-size:15.5px}
.hero .meta{font-size:15px;margin-top:4px}
.hero .neuf{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--vert)}
.desc{white-space:pre-line;line-height:1.6;font-size:15.5px}
.desc .intertitre{display:block;font-size:16.5px;margin:16px 0 4px;color:var(--texte)}
.desc .intertitre:first-child{margin-top:0}
.bloc ul{line-height:1.6}
.carte-map{width:100%;height:220px;border:0;border-radius:12px;margin-top:10px}
.replie{max-height:9.5em;overflow:hidden;position:relative}
.replie::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3em;background:linear-gradient(transparent,var(--carte))}
.lien-plus{border:0;background:none;color:var(--vert);font-weight:600;padding:4px 0}
label.champ{display:block;margin:8px 0;font-size:14px;color:var(--doux)}
label.champ input,label.champ textarea,label.champ select{display:block;width:100%;margin-top:4px;border:1px solid var(--ligne);background:var(--carte);border-radius:10px;padding:10px;color:var(--texte)}
textarea{min-height:170px;resize:vertical}
.cv-etat{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--vert-doux);color:var(--vert);font-weight:600}
.cv-etat.manque{background:var(--orange-doux);color:var(--orange)}
.menu a,.menu button.entree{display:flex;align-items:center;gap:12px;width:100%;padding:13px 4px;border:0;border-bottom:1px solid var(--ligne);background:none;text-align:left;color:var(--texte)}
.menu svg.ic{width:22px;height:22px;margin:0 4px;color:var(--vert)}
.cand{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ligne)}
.cand div{flex:1;min-width:0}
.cand small{color:var(--doux)}
.cand select{border:1px solid var(--ligne);background:var(--champ);border-radius:8px;padding:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#16201b;color:#fff;padding:11px 16px;border-radius:12px;z-index:90;max-width:90vw;font-size:14.5px;box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* ---------- Liquid Glass (style Apple, iOS 26 / 27) ----------
   Verre clair et lisse, flou du contenu derrière, lumière sur les bords (liseré), aucune bande brillante.
   Le vert reste la teinte des boutons principaux. */
:root{
  --lg-vert:rgba(18,119,73,.86);
  --lg-clair:rgba(255,255,255,.52);
  --lg-flou:blur(16px) saturate(185%);
  --lg-ombre:0 8px 24px -10px rgba(0,0,0,.25),0 1px 3px rgba(0,0,0,.08);
  --lg-bord:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,.18) 32%,rgba(255,255,255,0) 50%,rgba(255,255,255,.14) 72%,rgba(255,255,255,.6));
}
@media (prefers-color-scheme:dark){:root{
  --lg-vert:rgba(48,170,110,.62);
  --lg-clair:rgba(44,44,46,.5);
  --lg-ombre:0 10px 28px -10px rgba(0,0,0,.7),0 1px 3px rgba(0,0,0,.5);
  --lg-bord:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.08) 32%,rgba(255,255,255,0) 50%,rgba(255,255,255,.06) 72%,rgba(255,255,255,.3));
}}
/* surfaces vertes : boutons principaux, choix actifs */
.btn:not(.gris):not(.leger),.segments button.actif,.puce.actif{
  position:relative;isolation:isolate;background:var(--lg-vert);color:#fff;border-color:transparent;
  -webkit-backdrop-filter:var(--lg-flou);backdrop-filter:var(--lg-flou);
  box-shadow:inset 0 0 14px rgba(255,255,255,.14),var(--lg-ombre);
  transition:transform .45s cubic-bezier(.2,1.6,.4,1),box-shadow .3s,background .3s;
}
/* liseré de lumière sur le bord (la tranche du verre) */
.lg-bord::after,.btn:not(.gris):not(.leger)::after,.segments button.actif::after,.puce.actif::after,
.btn.leger::after,.onglets-bas::after,.onglets-bas button.actif::after,.segments::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:1;
  background:var(--lg-bord);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
}
/* lumière qui naît sous le doigt ou la souris, et goutte qui gonfle au toucher */
.btn:not(.gris):not(.leger)::before,.segments button.actif::before,.onglets-bas button::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;transition:opacity .35s;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.38),rgba(255,255,255,0) 60%);
}
.btn:not(.gris):not(.leger):hover::before,.segments button.actif:hover::before{opacity:.6}
.btn:not(.gris):not(.leger):active,.onglets-bas button:active,.segments button:active{transform:scale(1.04)}
.btn:not(.gris):not(.leger):active::before,.onglets-bas button:active::before,.segments button:active::before{opacity:1;transition:opacity .08s}
/* boutons secondaires : verre teinté de vert */
.btn.leger{position:relative;isolation:isolate;background:rgba(18,119,73,.12);color:var(--vert);
  -webkit-backdrop-filter:var(--lg-flou);backdrop-filter:var(--lg-flou);box-shadow:var(--lg-ombre)}
/* cadres des choix : verre clair, curseur vert */
.segments{position:relative;isolation:isolate;background:var(--lg-clair);border-color:transparent;
  -webkit-backdrop-filter:var(--lg-flou);backdrop-filter:var(--lg-flou);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.04),0 4px 14px -8px rgba(0,0,0,.18)}
.segments button{position:relative;transition:color .3s,background .3s,transform .45s cubic-bezier(.2,1.6,.4,1)}
/* interrupteur : rail vert uni, bouton blanc comme une perle de verre */
.bascule input:checked + i{background:var(--vert);box-shadow:none}
.bascule i::after{background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.04)}
.bascule:active i::after{transform:scale(1.15,1.08)}
.bascule input:checked + i::after{transform:translateX(18px)}
.bascule:active input:checked + i::after{transform:translateX(18px) scale(1.15,1.08)}
/* barre du bas (téléphone) : capsule de verre clair flottante ; onglet actif = capsule légère, icône verte */
@media (max-width:760px){
  .onglets-bas{left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));padding:5px;border-radius:32px;border:0;isolation:isolate;
    background:var(--lg-clair);-webkit-backdrop-filter:blur(14px) saturate(190%);backdrop-filter:blur(14px) saturate(190%);box-shadow:var(--lg-ombre);
    transition:left .45s cubic-bezier(.3,.8,.2,1),right .45s cubic-bezier(.3,.8,.2,1),padding .45s}
  .onglets-bas button{border-radius:26px;padding:6px 0 5px;color:var(--texte);position:relative;isolation:isolate;
    transition:color .25s,background .35s,transform .45s cubic-bezier(.2,1.6,.4,1)}
  .onglets-bas button.actif{color:var(--vert);background:rgba(120,120,128,.16);text-shadow:none}
  .onglets-bas button.actif svg.ic{stroke-width:2}
  .onglets-bas b{top:1px;background:var(--vert);box-shadow:0 0 0 1.5px var(--fond)}
  .onglets-bas.reduite{left:24%;right:24%;padding:4px}
  .onglets-bas.reduite button span{display:none}
  .onglets-bas.reduite button{padding:8px 0}
  body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom))}
}
@media (max-width:760px) and (prefers-color-scheme:dark){.onglets-bas button.actif{background:rgba(255,255,255,.12)}}
/* en-tête collé : verre clair */
.bandeau.colle{background:rgba(255,255,255,.72);-webkit-backdrop-filter:var(--lg-flou);backdrop-filter:var(--lg-flou)}
@media (prefers-color-scheme:dark){.bandeau.colle{background:rgba(0,0,0,.6)}}
/* mode « Teinté » (iOS 26.1) : verre plus opaque et plus lisible */
html.teinte{--lg-vert:#127749;--lg-clair:rgba(246,246,246,.96)}
html.teinte .bandeau.colle{background:var(--fond)}
@media (prefers-color-scheme:dark){html.teinte{--lg-vert:#1c8a57;--lg-clair:rgba(28,28,30,.97)}}
/* réglages du téléphone : « Réduire la transparence », « Augmenter le contraste » */

@media (prefers-contrast:more){
  :root{--lg-vert:#0b5a36;--lg-clair:var(--fond);--lg-bord:linear-gradient(var(--texte),var(--texte))}
  .btn,.segments,.onglets-bas{-webkit-backdrop-filter:none;backdrop-filter:none}
}


/* ---------- ordinateur : 2 annonces par ligne, comme un catalogue ---------- */
@media (min-width:900px){
  .liste{grid-template-columns:repeat(2,1fr);gap:14px}
  .offre{grid-template-columns:1fr 150px;padding:30px 30px 28px 34px;min-height:250px}
  .offre .carre{width:96px;height:96px;border-radius:22px}
  .offre .carre svg{width:40px;height:40px}
  .offre h3{font-size:22px}
}
@media (prefers-color-scheme:dark){
  .feuille{box-shadow:0 0 0 1px rgba(255,255,255,.1),0 30px 80px rgba(0,0,0,.6)}
  .voile{background:rgba(0,0,0,.6)}
}

/* ================= Liquid Glass sur toute l'appli (couche de navigation et de contrôles) ================= */
:root{
  --v-fond:rgba(255,255,255,.62);            /* verre clair */
  --v-fond-fort:rgba(255,255,255,.88);       /* panneaux (fiches, menus) : plus opaque pour lire le texte */
  --v-flou:blur(24px) saturate(190%) brightness(1.04);
  /* double liseré : la lumière entre en haut et ressort en bas, comme dans une lentille */
  --v-lentille:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.55),
    inset 0 10px 18px -14px rgba(255,255,255,.9),inset 0 -10px 18px -14px rgba(255,255,255,.6),inset 0 0 0 .5px rgba(0,0,0,.05);
  --v-ombre:0 12px 32px -14px rgba(16,40,28,.28),0 2px 6px rgba(16,40,28,.06);
  --ressort:cubic-bezier(.2,1.4,.35,1);
}
@media (prefers-color-scheme:dark){:root{
  --v-fond:rgba(36,36,38,.6);--v-fond-fort:rgba(28,28,30,.88);--v-flou:blur(24px) saturate(170%) brightness(.95);
  --v-lentille:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(255,255,255,.08),
    inset 0 10px 18px -14px rgba(255,255,255,.18),inset 0 -10px 18px -14px rgba(255,255,255,.08),inset 0 0 0 .5px rgba(255,255,255,.08);
  --v-ombre:0 14px 36px -12px rgba(0,0,0,.75),0 2px 6px rgba(0,0,0,.4);
}}
/* un fond à peine coloré (vert et or) pour que le verre ait quelque chose à refléter */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(60vw 50vh at 8% -5%,rgba(18,119,73,.07),transparent 60%),
  radial-gradient(50vw 45vh at 100% 10%,rgba(163,126,44,.07),transparent 60%),
  radial-gradient(70vw 60vh at 50% 110%,rgba(18,119,73,.05),transparent 60%)}
/* surfaces de verre clair */
.bandeau,.nu,.cherche-in,.offre .fav,.onglets,.toast,.feuille{
  -webkit-backdrop-filter:var(--v-flou);backdrop-filter:var(--v-flou)}
/* dans les rangées qui défilent sur le côté, le flou crée un fond gris : verre sans flou (il repose sur le fond uni) */
.filtres button,.dom .carre,.actifs button,.suggestions button,.lien-alerte,.btn.gris,.feuille .bloc{-webkit-backdrop-filter:none;backdrop-filter:none}
.nu,.filtres button,.actifs button,.btn.gris,.offre .fav,.dom .carre,.onglets,.suggestions button,.lien-alerte{
  background:var(--v-fond);box-shadow:var(--v-lentille),var(--v-ombre);border:0;
  transition:transform .5s var(--ressort),background .3s,box-shadow .3s,color .3s}
.nu:active,.filtres button:active,.actifs button:active,.btn.gris:active,.offre .fav:active,.dom:active .carre,.suggestions button:active,.lien-alerte:active{transform:scale(1.06)}
/* en-tête : verre permanent, les annonces passent dessous */
.bandeau{background:var(--v-fond);box-shadow:0 1px 0 rgba(0,0,0,.04)}
.bandeau.colle{background:var(--v-fond);box-shadow:var(--v-ombre)}
.nu{width:42px;height:42px}
.droite{gap:8px}
/* onglets Alternance / Emploi : capsule de verre, pastille verte qui glisse */
.onglets{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:0;width:min(420px,100%);margin:clamp(26px,4vw,44px) auto 0;padding:5px;border-radius:999px}
.onglets::before{content:"";position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:999px;
  background:var(--lg-vert);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 14px rgba(255,255,255,.14),0 6px 16px -8px rgba(18,119,73,.6);
  transform:translateX(calc(var(--i,0) * 100%));transition:transform .55s var(--ressort)}
.onglets button{position:relative;z-index:1;border:0;padding:12px 10px;border-radius:999px;font-size:16px;color:var(--texte);transition:color .3s}
.onglets button.actif{color:#fff;border:0}
/* barre de filtres : capsules de verre */
.filtres{gap:10px;padding:clamp(24px,3.5vw,40px) 4px 20px}
.filtres button{padding:10px 16px;border-radius:999px;font-size:15px}
.filtres button.actif{color:var(--vert);background:rgba(18,119,73,.12)}
.filtres .ressort{display:none}
.actifs button{padding:7px 11px 7px 14px}
.lien-alerte{padding:8px 14px;border-radius:999px}
/* recherche : capsule de verre */
.cherche{background:transparent;border-top:0}
.cherche-in{max-width:1168px;margin:4px auto 8px;border-radius:999px;padding:2px 10px 2px 18px;background:var(--v-fond);box-shadow:var(--v-lentille),var(--v-ombre)}
.suggestions button{border:0}
/* boutons secondaires et cœur : verre clair */
.btn.gris{border:0}
.offre .fav{display:grid;place-items:center;width:40px;height:40px;padding:0;top:16px;left:16px}
/* domaines : carrés de verre */
.dom .carre{background:var(--v-fond)}
.dom.actif .carre{background:rgba(255,255,255,.9);box-shadow:var(--v-lentille),0 14px 30px -12px rgba(18,119,73,.35),inset 0 0 0 1.5px rgba(18,119,73,.35)}
@media (prefers-color-scheme:dark){.dom.actif .carre{background:rgba(60,60,64,.8)}}
/* fenêtres : grands panneaux de verre flottants, ouverture avec effet ressort */
.voile{background:rgba(10,20,15,.22);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.feuille{background:var(--v-fond-fort);box-shadow:var(--v-lentille),0 30px 80px -20px rgba(0,0,0,.45);
  margin:0 8px calc(8px + env(safe-area-inset-bottom));border-radius:34px;animation:none;max-height:calc(100vh - 24px);will-change:transform,clip-path}
@keyframes surgit{from{transform:translateY(30px) scale(.96);opacity:0}}
@media (min-width:760px){.feuille{margin:0;border-radius:34px}}
.feuille .bloc{background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.04);border-radius:22px}
.feuille .hero{background:rgba(255,255,255,.75);border-radius:24px!important}
.feuille .barre .rond{background:var(--v-fond);box-shadow:var(--v-lentille),var(--v-ombre);border:0}
@media (prefers-color-scheme:dark){.feuille .bloc,.feuille .hero{background:rgba(255,255,255,.06)}}
/* messages : capsule de verre sombre */
.toast{background:rgba(22,30,26,.72);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 14px 30px -10px rgba(0,0,0,.45);border-radius:999px;padding:12px 20px;animation:surgit .45s var(--ressort)}
/* mode Teinté et accessibilité : verre plus opaque, ou pas de verre du tout */
html.teinte{--v-fond:rgba(250,250,250,.94);--v-fond-fort:rgba(250,250,250,.97)}
@media (prefers-color-scheme:dark){html.teinte{--v-fond:rgba(30,30,32,.95);--v-fond-fort:rgba(26,26,28,.97)}}

@media (prefers-contrast:more){:root{--v-fond:var(--fond);--v-lentille:inset 0 0 0 1px var(--texte)}}


/* rangées qui défilent : ombres courtes et marge, pour qu'elles ne se coupent pas en bande grise */
.filtres button,.dom .carre,.actifs button,.suggestions button{box-shadow:var(--v-lentille),0 3px 10px -6px rgba(16,40,28,.25)}
.filtres{padding-left:8px;padding-right:8px;margin:0 -8px}
.rail-dom{padding-left:8px;padding-right:8px;margin:0 -8px}

/* goutte de verre de la barre du bas : elle glisse et s'étire entre les onglets */
.goutte{display:none}
@media (max-width:760px){
  .goutte{display:block;position:absolute;left:5px;top:5px;border-radius:26px;z-index:0;pointer-events:none;
    background:rgba(120,120,128,.17);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(255,255,255,.35),0 2px 8px -4px rgba(0,0,0,.2);
    transition:left .55s var(--ressort),width .55s var(--ressort),top .4s var(--ressort),height .4s var(--ressort)}
  .onglets-bas button{z-index:1;background:none!important}
  .onglets-bas button.actif::after{display:none}
}
@media (max-width:760px) and (prefers-color-scheme:dark){.goutte{background:rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}}


/* ---------- en-tête, onglets et domaines : verre et mouvement liquide ---------- */
.rail-dom{position:relative}
.goutte-dom{position:absolute;z-index:0;border-radius:26px;pointer-events:none;
  background:linear-gradient(180deg,rgba(18,119,73,.13),rgba(18,119,73,.07));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -1px 0 rgba(255,255,255,.4),inset 0 0 0 1px rgba(18,119,73,.14),0 10px 24px -14px rgba(18,119,73,.5);
  transition:left .6s var(--ressort),width .6s var(--ressort)}
.dom{position:relative;z-index:1}
/* reflet qui suit la souris ou le doigt */
.dom .carre,.nu,.onglets,.filtres button{position:relative;isolation:isolate;overflow:hidden}
.offre .fav{position:absolute;isolation:isolate;overflow:hidden}
.dom .carre::after,.nu::after,.onglets::after,.filtres button::after,.offre .fav::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;transition:opacity .4s;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.9),rgba(255,255,255,0) 62%)}
.dom:hover .carre::after,.nu:hover::after,.onglets:hover::after,.filtres button:hover::after,.offre .fav:hover::after{opacity:1}
@media (prefers-color-scheme:dark){.dom .carre::after,.nu::after,.onglets::after,.filtres button::after,.offre .fav::after{background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.18),rgba(255,255,255,0) 62%)}}
.onglets button{z-index:1}
/* goutte qui se soulève au survol, s'écrase au toucher et rebondit */
.dom .carre,.nu{transition:transform .55s var(--ressort),box-shadow .35s,background .3s}
.dom:hover .carre{transform:translateY(-4px) scale(1.045);box-shadow:var(--v-lentille),0 16px 30px -14px rgba(16,40,28,.35)}
.dom:active .carre{transform:scale(.9,.86);transition:transform .12s}
.nu:hover{transform:scale(1.07)}
.nu:active{transform:scale(.88,.84);transition:transform .12s}
.filtres button:active,.actifs button:active,.offre .fav:active{transform:scale(.9,.86);transition:transform .12s}
.dom.actif .carre{background:rgba(255,255,255,.92)}

/* ---------- vert en Liquid Glass : verre teinté translucide, lumière en lentille, liseré lumineux ---------- */
:root{
  --lg-vert:rgba(17,124,76,.74);
  --lg-vert-lentille:radial-gradient(120% 150% at 50% -35%,rgba(255,255,255,.42),rgba(255,255,255,0) 58%),
    radial-gradient(110% 130% at 50% 140%,rgba(150,255,205,.38),rgba(150,255,205,0) 60%);
  --lg-vert-ombre:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(200,255,228,.45),
    inset 0 12px 20px -14px rgba(255,255,255,.75),inset 0 -12px 18px -14px rgba(170,255,215,.55),
    inset 0 0 0 .5px rgba(255,255,255,.35),0 10px 26px -12px rgba(17,124,76,.55),0 2px 6px -2px rgba(17,124,76,.25);
}
@media (prefers-color-scheme:dark){:root{
  --lg-vert:rgba(40,170,108,.5);
  --lg-vert-ombre:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(160,255,210,.25),
    inset 0 12px 20px -14px rgba(255,255,255,.35),inset 0 -12px 18px -14px rgba(120,255,190,.3),
    inset 0 0 0 .5px rgba(255,255,255,.2),0 10px 28px -12px rgba(40,170,108,.5);
}}
.btn:not(.gris):not(.leger),.segments button.actif,.puce.actif{
  background:var(--lg-vert-lentille),var(--lg-vert);box-shadow:var(--lg-vert-ombre);
  -webkit-backdrop-filter:blur(18px) saturate(200%) brightness(1.06);backdrop-filter:blur(18px) saturate(200%) brightness(1.06);
  text-shadow:0 1px 2px rgba(0,60,30,.35)}
.onglets::before{background:var(--lg-vert-lentille),var(--lg-vert);box-shadow:var(--lg-vert-ombre);
  -webkit-backdrop-filter:blur(18px) saturate(200%);backdrop-filter:blur(18px) saturate(200%)}
.onglets button.actif{text-shadow:0 1px 2px rgba(0,60,30,.35)}
.onglets-bas b{background:var(--lg-vert-lentille),var(--lg-vert);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 0 1.5px var(--fond)}
.btn:not(.gris):not(.leger):hover{background:var(--lg-vert-lentille),rgba(17,124,76,.8)}
html.teinte{--lg-vert:#127749}
@media (prefers-contrast:more){:root{--lg-vert:#0b5a36;--lg-vert-lentille:linear-gradient(transparent,transparent)}}


/* ================= Liquid Glass partout : annonces, fenêtres, champs, menus, réglages ================= */
:root{
  --v-carte:rgba(255,255,255,.6);
  --v-carte-survol:rgba(255,255,255,.78);
  --v-champ:rgba(255,255,255,.55);
  --v-rail:rgba(120,120,128,.2);
}
@media (prefers-color-scheme:dark){:root{
  --v-carte:rgba(40,40,44,.55);--v-carte-survol:rgba(54,54,58,.66);--v-champ:rgba(255,255,255,.06);--v-rail:rgba(120,120,128,.32);
}}
/* annonces : tuiles de verre arrondies, lumière qui suit le doigt, soulèvement au survol */
.offre,.hero{border-radius:30px!important}
.offre{isolation:isolate;overflow:hidden;background:var(--v-carte);box-shadow:var(--v-lentille),var(--v-ombre);
  transition:transform .55s var(--ressort),box-shadow .35s,background .3s}
.offre::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;transition:opacity .45s;
  background:radial-gradient(70% 90% at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.95),rgba(255,255,255,0) 70%)}
.offre:hover{background:var(--v-carte-survol);transform:translateY(-3px);box-shadow:var(--v-lentille),0 22px 44px -18px rgba(16,40,28,.32),0 2px 6px rgba(16,40,28,.06)}
.offre:hover::before{opacity:.75}
.offre:active{transform:scale(.975,.965);transition:transform .14s}
@media (prefers-color-scheme:dark){
  .offre::before{background:radial-gradient(70% 90% at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.14),rgba(255,255,255,0) 70%)}
  .offre:hover{background:var(--v-carte-survol)}
}
.liste{gap:14px}
.vide{background:var(--v-carte);box-shadow:var(--v-lentille),var(--v-ombre);border-radius:30px}
#carte{border-radius:30px;box-shadow:var(--v-lentille),var(--v-ombre)}
/* fenêtres : blocs de verre */
.feuille .bloc,.feuille .hero{background:var(--v-carte);box-shadow:var(--v-lentille),0 6px 20px -14px rgba(16,40,28,.25);border-radius:26px!important}
@media (prefers-color-scheme:dark){.feuille .bloc,.feuille .hero{background:rgba(255,255,255,.07)}}
.replie::after{background:linear-gradient(transparent,rgba(255,255,255,.92))}
@media (prefers-color-scheme:dark){.replie::after{background:linear-gradient(transparent,rgba(40,40,44,.95))}}
/* champs : verre creusé, lueur verte au focus */
label.champ input:not([type=range]):not([type=checkbox]):not([type=radio]),label.champ textarea,label.champ select,.feuille :is(input[type=text],input[type=email],input[type=search],input[type=tel],input[type=date],input[type=number],input:not([type])){
  border:0;border-radius:16px;padding:12px 14px;background:var(--v-champ);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.06),inset 0 0 0 .5px rgba(0,0,0,.08),0 1px 0 rgba(255,255,255,.9);
  transition:box-shadow .35s,background .3s,transform .45s var(--ressort);outline:0}
label.champ input:focus,label.champ textarea:focus,label.champ select:focus,.feuille :is(input[type=text],input[type=email],input[type=search],input[type=tel],input[type=date],input[type=number],input:not([type])):focus{
  background:rgba(255,255,255,.85);transform:scale(1.01);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 0 0 4px rgba(18,119,73,.16),0 0 0 1px rgba(18,119,73,.45),0 10px 24px -14px rgba(18,119,73,.5)}
@media (prefers-color-scheme:dark){
  label.champ input:not([type=range]):not([type=checkbox]):not([type=radio]),label.champ textarea,label.champ select,.feuille :is(input[type=text],input[type=email],input[type=search],input[type=tel],input[type=date],input[type=number],input:not([type])){box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1)}
  label.champ input:focus,label.champ textarea:focus,label.champ select:focus,.feuille :is(input[type=text],input[type=email],input[type=search],input[type=tel],input[type=date],input[type=number],input:not([type])):focus{background:rgba(255,255,255,.1)}
}
/* interrupteurs : rail de verre, perle qui s'étire comme une goutte */
.bascule i{background:var(--v-rail);box-shadow:inset 0 1px 2px rgba(0,0,0,.08);transition:background .35s}
.bascule input:checked + i{background:var(--lg-vert-lentille),var(--lg-vert);box-shadow:var(--lg-vert-ombre)}
.bascule i::after{transition:transform .5s var(--ressort),width .35s var(--ressort);
  background:radial-gradient(circle at 50% 25%,#fff,rgba(255,255,255,.9) 60%,rgba(235,240,238,.95));
  box-shadow:inset 0 -1px 1px rgba(0,0,0,.06),0 3px 8px rgba(0,0,0,.2),0 0 0 .5px rgba(0,0,0,.05)}
.bascule:active i::after{width:28px;transform:scale(1.08)}
.bascule:active input:checked + i::after{transform:translateX(12px) scale(1.08)}
/* curseur de salaire : piste de verre, poignée en perle */
input[type=range]{-webkit-appearance:none;appearance:none;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--v-rail);box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--v-rail)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--lg-vert)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;
  background:radial-gradient(circle at 50% 25%,#fff,rgba(255,255,255,.9) 60%,rgba(235,240,238,.95));
  box-shadow:0 3px 9px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.06);transition:transform .45s var(--ressort)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff;box-shadow:0 3px 9px rgba(0,0,0,.22)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.3,1.18)}
/* menus et listes de choix : rangées qui s'allument en verre au toucher */
.menu a,.menu button.entree,.opt{border-radius:16px;padding-left:12px;padding-right:12px;border-bottom-color:transparent;
  position:relative;transition:background .3s,transform .45s var(--ressort),box-shadow .3s}
.menu a:hover,.menu button.entree:hover,.opt:hover{background:var(--v-carte);box-shadow:var(--v-lentille)}
.menu a:active,.menu button.entree:active,.opt:active{transform:scale(.97)}
.opt.actif{background:rgba(18,119,73,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 0 0 1px rgba(18,119,73,.18)}
.cv-etat{border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 0 0 1px rgba(18,119,73,.15)}
.cand{border-bottom-color:rgba(0,0,0,.06)}
/* pied de page */
.pied{opacity:.85}
/* onde liquide au toucher */
.onde{position:absolute;border-radius:50%;pointer-events:none;z-index:2;width:16px;height:16px;margin:-8px 0 0 -8px;
  background:radial-gradient(circle,rgba(255,255,255,.75),rgba(255,255,255,.25) 45%,rgba(255,255,255,0) 70%)}
@media (prefers-color-scheme:dark){.onde{background:radial-gradient(circle,rgba(255,255,255,.3),rgba(255,255,255,.08) 45%,rgba(255,255,255,0) 70%)}}
/* teinté et accessibilité */
html.teinte{--v-carte:rgba(250,250,250,.95);--v-champ:rgba(240,240,240,.97)}

@media (prefers-contrast:more){:root{--v-carte:var(--carte)}.offre,.feuille .bloc{box-shadow:inset 0 0 0 1px var(--texte)}}


/* ================= fond vivant : de la couleur derrière le verre, sinon le verre ne se voit pas ================= */
body::before{content:"";position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;will-change:transform;
  background:
    radial-gradient(34vmax 30vmax at 30% 28%,rgba(18,160,95,.42),transparent 70%),
    radial-gradient(30vmax 28vmax at 72% 36%,rgba(222,170,60,.40),transparent 70%),
    radial-gradient(34vmax 30vmax at 32% 62%,rgba(56,178,172,.34),transparent 70%),
    radial-gradient(32vmax 30vmax at 70% 74%,rgba(18,130,80,.36),transparent 70%),
    var(--fond);
  animation:derive 38s ease-in-out infinite alternate}
@keyframes derive{0%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(-4vmax,3vmax,0) rotate(8deg)}100%{transform:translate3d(3vmax,-3vmax,0) rotate(-6deg)}}
body{background:transparent}
html{background:var(--fond)}
@media (prefers-color-scheme:dark){body::before{background:
    radial-gradient(34vmax 30vmax at 30% 28%,rgba(30,170,105,.42),transparent 70%),
    radial-gradient(30vmax 28vmax at 72% 36%,rgba(200,150,50,.30),transparent 70%),
    radial-gradient(34vmax 30vmax at 32% 62%,rgba(40,150,150,.30),transparent 70%),
    radial-gradient(32vmax 30vmax at 70% 74%,rgba(18,119,73,.40),transparent 70%),
    var(--fond)}}
/* le verre laisse passer la couleur : tuiles plus transparentes, bord lumineux bien visible */
:root{--v-carte:rgba(255,255,255,.4);--v-carte-survol:rgba(255,255,255,.6);--v-fond:rgba(255,255,255,.48)}
@media (prefers-color-scheme:dark){:root{--v-carte:rgba(28,28,32,.42);--v-carte-survol:rgba(44,44,48,.55);--v-fond:rgba(36,36,40,.48)}}
.offre{box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.5),inset 1px 0 0 rgba(255,255,255,.55),inset -1px 0 0 rgba(255,255,255,.35),
  inset 0 18px 30px -24px rgba(255,255,255,.95),var(--v-ombre)}
@media (prefers-color-scheme:dark){.offre{box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.08),inset 1px 0 0 rgba(255,255,255,.1),inset -1px 0 0 rgba(255,255,255,.06),var(--v-ombre)}}
.offre .carre{background:rgba(255,255,255,.75);box-shadow:var(--v-lentille),0 8px 18px -10px rgba(16,40,28,.3)}
@media (prefers-color-scheme:dark){.offre .carre{background:rgba(255,255,255,.08)}}
/* la fenêtre ouverte : verre épais qui laisse deviner la couleur */
.feuille{background:rgba(255,255,255,.72)}
@media (prefers-color-scheme:dark){.feuille{background:rgba(24,24,28,.72)}}
/* apparition des annonces : elles émergent du verre en défilant */
.offre.a-venir{opacity:0;transform:translateY(34px) scale(.94)}
.offre.vu{transition:opacity .6s cubic-bezier(.2,.9,.3,1),transform .8s var(--ressort),box-shadow .35s,background .3s}
/* fluidité : les tuiles hors écran ne coûtent rien, les ombres ne se recalculent pas pendant le défilement */
.offre{contain:layout paint style}
/* choix « Animations réduites » dans le menu */
html.doux *,html.doux *::before,html.doux *::after{animation:none!important;transition-duration:.01s!important}
html.doux .offre.a-venir{opacity:1;transform:none}
html.teinte body::before{opacity:.35}

/* ================= fluidité ================= */
/* fond immobile : un fond qui bouge oblige le téléphone à recalculer le flou de chaque verre à chaque image */
body::before{animation:none;will-change:auto;inset:0}
/* voile sans flou plein écran ; le verre de la fenêtre suffit */
.voile{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(10,20,15,.3)}
/* cœurs des annonces : verre sans flou (des dizaines de flous à l'écran ralentissent le défilement) */
.offre .fav{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(255,255,255,.8)}
@media (prefers-color-scheme:dark){.offre .fav{background:rgba(60,60,64,.7)}}
/* flou plus léger sur les grands panneaux, couche dédiée pendant l'animation */
.feuille{-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);contain:layout paint}
.offre{transition:transform .5s var(--ressort),background .3s}
.offre:hover{box-shadow:var(--v-lentille),var(--v-ombre)}
.fantome{position:fixed;z-index:3;border-radius:34px;pointer-events:none;will-change:transform,clip-path;
  background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(244,247,245,.96));box-shadow:inset 0 1px 0 #fff,0 30px 80px -20px rgba(0,0,0,.45)}
@media (prefers-color-scheme:dark){.fantome{background:linear-gradient(180deg,rgba(44,44,48,.97),rgba(26,26,30,.97));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 30px 80px -20px rgba(0,0,0,.7)}}
.feuille{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(251,252,251,.9);transition:none}
.feuille.posee{-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%)}
@media (prefers-color-scheme:dark){.feuille{background:rgba(26,26,30,.9)}}
html.teinte .feuille.posee{background:var(--v-fond-fort)}

/* ---------- envoyer mon CV ---------- */
function lettre(a) {
  if (LETTRES[a.id]) return LETTRES[a.id];
  const r = {prenom: PROFIL.prenom, nom: PROFIL.nom, tel: PROFIL.tel, email: PROFIL.email, formation: PROFIL.formation || "ma formation",
    poste: a.type === "spontanee" ? "alternance" : a.titre, entreprise: a.entreprise};
  if (a.categorie === "emploi" && PROFIL.lettre === LETTRE_ALT) return `Bonjour,\n\nJe m'appelle ${r.prenom} ${r.nom} et votre offre « ${r.poste} » chez ${r.entreprise} m'intéresse beaucoup.\n\nVous trouverez mon CV en pièce jointe. Je suis disponible pour un entretien quand vous le souhaitez.\n\nBien cordialement,\n${r.prenom} ${r.nom}\n${r.tel}`;
  let t = PROFIL.lettre.replace(/\{(\w+)\}/g, (m, k) => r[k] ?? m);
  if (a.type === "spontanee") t = t.replace(/Votre offre « alternance » chez ([^.]+) m'intéresse beaucoup\./, "Je souhaite rejoindre $1 en alternance.");
  return t;
}
async function envoyerCV(a) {
  const cv = await cvLire();
  if (!cv) { toast("Ajoute d'abord ton CV"); return panneauCV(a); }
  const sujet = `Candidature${a.categorie === "emploi" ? "" : " en alternance"} – ${a.type === "spontanee" ? "candidature spontanée" : a.titre}`;
  const texte = lettre(a);
  const fichier = new File([cv], cv.name || "CV.pdf", {type: cv.type || "application/pdf"});
  // sur téléphone : partage du CV en pièce jointe (Mail, Gmail, WhatsApp…)
  if (navigator.canShare && navigator.canShare({files: [fichier]})) {
    try {
      try { await navigator.clipboard.writeText((a.email ? a.email + "\n\n" : "") + texte); } catch (e) {}
      await navigator.share({files: [fichier], title: sujet, text: texte});
      noter(a); afficher();
      toast(a.email ? `CV partagé. Adresse de l'entreprise copiée : ${a.email}` : "CV partagé");
      return;
    } catch (e) { if (e.name === "AbortError") return; }
  }
  if (a.email) {
    location.href = `mailto:${encodeURIComponent(a.email)}?subject=${encodeURIComponent(sujet)}&body=${encodeURIComponent(texte)}`;
    const lien = document.createElement("a"); lien.href = URL.createObjectURL(fichier); lien.download = fichier.name; lien.click();
    toast("Le mail est prêt : ajoute ton CV en pièce jointe (il vient d'être téléchargé)");
    noter(a); afficher();
  } else if (sur(a.postuler)) {
    try { await navigator.clipboard.writeText(texte); } catch (e) {}
    window.open(sur(a.postuler), "_blank", "noopener");
    toast("Ta lettre est copiée : colle-la dans le formulaire et ajoute ton CV");
  } else {
    toast("Pas d'email pour cette entreprise : appelle-la ou passe par Google Maps");
  }
}

const QUALITES = [["sérieux", "sérieuse"], ["motivé", "motivée"], ["ponctuel", "ponctuelle"], ["dynamique", "dynamique"], ["autonome", "autonome"],

  "Transport, logistique": ["l'organisation et le bon acheminement des marchandises", "être fiable, organisé et respecter les délais"],

  "Banque, assurance, immobilier": ["le conseil et la relation de confiance avec les clients", "être rigoureux, discret et pédagogue"],

  "Industrie": ["la production et la qualité", "être précis, attentif aux consignes de sécurité et à la qualité"],
  "Spectacle, sport": ["le sport et l'animation", "être dynamique, pédagogue et rassembleur"],
};
let LM = Object.assign({genre: "", formation: "", ecole: "", rythme: "", debut: "", qualites: ["motivé", "sérieux", "ponctuel"], experiences: "", pourquoi: "", commune: "", variante: 0}, lire("alt974-lm", {}));

function accord(m) {
  const q = QUALITES.find(x => x[0] === m) || [m, m];
  return LM.genre === "f" ? q[1] : LM.genre === "m" || q[0] === q[1] ? q[0] : q[1].startsWith(q[0]) ? `${q[0]}(${q[1].slice(q[0].length)})` : `${q[0]}/${q[1]}`;
}
const e_ = () => LM.genre === "f" ? "e" : LM.genre === "m" ? "" : "(e)";
const a_ = c => /^Le /.test(c) ? "au " + c.slice(3) : /^Les /.test(c) ? "aux " + c.slice(4) : "à " + c;  // à Saint-Denis, au Port
const joli = l => l.length < 2 ? l.join("") : l.slice(0, -1).join(", ") + " et " + l[l.length - 1];

function ecrireLettre(o) {
  const alt = o.categorie !== "emploi", spont = !o.poste || /candidature spontan/i.test(o.poste);

  const v = LM.variante % 3;

    `Passionné${e_()} par ${attire}, je souhaite me former en alternance au sein de ${o.entreprise}, en préparant ${formation}.`,
  ][v] : [

  const rythme = alt ? `${LM.rythme ? `Ma formation se déroule au rythme suivant : ${LM.rythme}. ` : ""}Je suis disponible ${dispo} pour commencer mon contrat.`

  const lieu = LM.commune || (POS && COMMUNES[POS.nom] ? POS.nom : "");

    o.entreprise, o.commune || "", "",

    nom,

}

/* ---------- notifications (Web Push) ---------- */
const VAPID = "BELW2vkzh_ExmwyQlA4tQNi6rSXtBDZPDX2i1g-mXCFM2n5sHz6Rw4y065ax3IUcMbcmlRtCNEeXtWAVgpsAsbE", TOPIC = "alternance974-k3v8qz2m-abonnements";
let SW = null;
let NOTIF = Object.assign({actif: false, sections: ["alternance", "emploi"], spontanees: false, domaines: []}, lire("alt974-notif", {}));
const cleVapid = b => Uint8Array.from(atob(b.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - b.length % 4) % 4)), c => c.charCodeAt(0));
const iosHorsAppli = /iPhone|iPad|iPod/.test(navigator.userAgent) && !navigator.standalone && !matchMedia("(display-mode: standalone)").matches;
if ("serviceWorker" in navigator) {
  // une nouvelle version du site prend la main : on recharge une fois pour l'afficher tout de suite
  const avait = !!navigator.serviceWorker.controller; let recharge = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (avait && !recharge) { recharge = true; location.reload(); } });
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).then(r => { SW = r; r.update().catch(() => {}); if (navigator.clearAppBadge) navigator.clearAppBadge().catch(() => {}); }).catch(() => {});

async function deposer(abo, stop) {
  // lieu arrondi (~1 km) : seul le rayon compte pour choisir les offres
  const choix = {sections: NOTIF.sections, spontanees: NOTIF.spontanees, domaines: NOTIF.domaines,
    ...(POS && F.rayon < 70 ? {lat: +POS.lat.toFixed(2), lon: +POS.lon.toFixed(2), rayon: F.rayon, lieu: POS.nom} : {rayon: 70})};
  const r = await fetch("https://ntfy.sh/" + TOPIC, {method: "POST", body: JSON.stringify(stop ? {abo, stop: true} : {abo, choix})});
  if (!r.ok) throw new Error(r.status);
}
async function activerNotifs() {
  if (iosHorsAppli) return toast("Sur iPhone : installe d'abord l'appli (Partager → Sur l'écran d'accueil), puis ouvre-la depuis l'icône");
  if (!("PushManager" in window) || !("Notification" in window)) return toast("Ce navigateur ne gère pas les notifications");
  if (!SW) SW = await navigator.serviceWorker.ready;
  if (await Notification.requestPermission() !== "granted") return toast("Notifications refusées : autorise-les dans les réglages du téléphone");
  try {
    const abo = (await SW.pushManager.getSubscription()) || await SW.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: cleVapid(VAPID)});
    await deposer(abo.toJSON ? abo.toJSON() : abo, false);
    NOTIF.actif = true; ecrire("alt974-notif", NOTIF);
    toast("Notifications activées. Tu seras prévenu(e) des nouvelles offres");
  } catch (e) { toast("Activation impossible pour l'instant, réessaie plus tard"); }
  panneauNotifs();
}
async function couperNotifs() {
  try {
    const abo = SW && await SW.pushManager.getSubscription();
    if (abo) { await deposer(abo.toJSON(), true); await abo.unsubscribe(); }
  } catch (e) {}
  NOTIF.actif = false; ecrire("alt974-notif", NOTIF); toast("Notifications désactivées"); panneauNotifs();
}
function panneauNotifs() {
  const doms = Object.keys(METIER);
  const coche = (id, on, t) => `<label style="display:flex;gap:10px;align-items:center;padding:8px 0"><input type="checkbox" id="${id}" ${on ? "checked" : ""} style="width:20px;height:20px;accent-color:var(--vert)">${t}</label>`;
  ouvrir(`${barre(`${ic("cloche")} Notifications`)}
    <div class="bloc">

      <p class="aide" style="margin-top:8px">Une notification arrive sur ton téléphone dès qu'une nouvelle offre qui te correspond est publiée (une recherche toutes les 5 heures).</p>
      ${iosHorsAppli ? '<p class="aide"><b>Sur iPhone</b> : installe d\'abord l\'appli (bouton Partager → « Sur l\'écran d\'accueil »), puis ouvre-la depuis son icône pour activer les notifications.</p>' : ""}
    </div>
    <div class="bloc"><h4>Me prévenir pour</h4>
      ${coche("n-alt", NOTIF.sections.includes("alternance"), `${ic("toque")} Les offres d'alternance`)}

      ${coche("n-spont", NOTIF.spontanees, "Les entreprises qui recrutent en candidature spontanée")}
      <label class="champ">Domaines (aucun choisi = tous)</label>
      <div class="qualites" id="n-doms">${doms.map(d => `<button class="puce ${NOTIF.domaines.includes(d) ? "actif" : ""}" data-d="${esc(d)}">${icDom(d)} ${esc(d)}</button>`).join("")}</div>
      <p class="aide">Lieu : ${POS && F.rayon < 70 ? `dans un rayon de ${F.rayon} km autour de ${esc(POS.nom)}` : "toute l'île"} (réglable dans « Ma position » sur l'accueil).</p>
    </div>
    <div class="actions">
      <button class="btn large" id="n-ok">${NOTIF.actif ? "Enregistrer mes choix" : `${ic("cloche")} Activer les notifications`}</button>
      ${NOTIF.actif ? '<button class="btn gris large" id="n-stop">Désactiver</button>' : ""}
    </div>`);
  const lireChoix = () => {
    NOTIF.sections = [$("#n-alt").checked && "alternance", $("#n-emp").checked && "emploi"].filter(Boolean);
    NOTIF.spontanees = $("#n-spont").checked; ecrire("alt974-notif", NOTIF);
  };
  $("#n-doms").onclick = e => { const b = e.target.closest("[data-d]"); if (!b) return; const i = NOTIF.domaines.indexOf(b.dataset.d); i >= 0 ? NOTIF.domaines.splice(i, 1) : NOTIF.domaines.push(b.dataset.d); b.classList.toggle("actif", i < 0); ecrire("alt974-notif", NOTIF); };
  $("#n-ok").onclick = () => { lireChoix(); if (!NOTIF.sections.length) return toast("Coche l'alternance, l'emploi, ou les deux"); activerNotifs(); };
  const st = $("#n-stop"); if (st) st.onclick = couperNotifs;
}

}
function menu() {
  ouvrir(`${barre("Menu")}<div class="bloc menu">
    <button class="entree" id="m-espace">${ic("gens")}Mon espace</button>
    <button class="entree" id="m-cv">${ic("doc")}Mon CV et mes infos</button>
    <button class="entree" id="m-notif">${ic("cloche")}Notifications ${NOTIF.actif ? "(activées)" : ""}</button>
    <button class="entree" id="m-lm">${ic("stylo")}Écrire une lettre de motivation</button>
    <button class="entree" id="m-verre">${ic("reglages")}Liquid Glass : ${VERRE_ACTIF ? "activé" : "désactivé"}</button>
    <button class="entree" id="m-anim">${ic("reglages")}Animations : ${ANIM_ACTIVES ? "activées" : "désactivées"}</button>
    <button class="entree" id="m-maj">${ic("maj")}Actualiser les offres</button>
    <button class="entree" id="m-guide">${ic("doc")}Le guide de l'alternance et du job</button>
    <button class="entree" id="m-simu">${ic("d-barres")}Simulateur de salaire d'apprenti</button>
    <button class="entree" id="m-masq">${ic("croix")}Offres masquées (${Object.keys(MASQUEES).length})</button>
    <button class="entree" id="m-cand">${ic("coche")}Mes candidatures (${Object.keys(CAND).length})</button>
    <button class="entree" id="m-fav">${ic("coeur")}Mes favoris (${Object.keys(FAV).length})</button>
  </div>
  <div class="bloc menu"><h4>Aussi sur</h4><p class="aide">Ces sites et applis refusent la lecture automatique : la recherche « ${F.section === "emploi" ? "emploi" : "alternance"} à La Réunion » s'ouvre directement.</p>
    ${AUSSI(F.section === "emploi" ? "" : "alternance").map(([n, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${ic("lien")}${esc(n)}</a>`).join("")}
  </div>
  <p class="aide" style="text-align:center">Offres relevées : ${esc(SOURCES)}.<br>Installer : Partager → « Sur l'écran d'accueil ».</p>`);
  $("#m-cv").onclick = () => panneauCV();
  $("#m-cand").onclick = panneauCandidatures;
  $("#m-espace").onclick = () => panneauEspace();
  $("#m-guide").onclick = () => panneauGuide();
  $("#m-simu").onclick = () => panneauGuide("simu");
  $("#m-masq").onclick = () => { F.type = "masquees"; sauver(); puces(); afficher(); fermer(); toast("Offres masquées : ouvre une offre pour la rendre visible"); };
  $("#m-lm").onclick = () => panneauLettre(null);
  $("#m-notif").onclick = panneauNotifs;
  $("#m-maj").onclick = () => { fermer(); actualiser(); };
  $("#m-verre").onclick = () => { TEINTE = !TEINTE; ecrire("alt974-teinte", TEINTE); document.documentElement.classList.toggle("teinte", TEINTE); toast(TEINTE ? "Verre teinté : plus opaque et plus lisible" : "Verre transparent"); menu(); };
  $("#m-anim").onclick = () => { ANIM_ACTIVES = !ANIM_ACTIVES; ANIM_DOUCES = !ANIM_ACTIVES; ecrire("alt974-animations", ANIM_ACTIVES); document.documentElement.classList.toggle("doux", ANIM_DOUCES); toast(ANIM_ACTIVES ? "Animations activées" : "Animations désactivées"); menu(); };
  $("#m-verre").onclick = () => { VERRE_ACTIF = !VERRE_ACTIF; TEINTE = !VERRE_ACTIF; ecrire("alt974-verre-liquide", VERRE_ACTIF); document.documentElement.classList.toggle("teinte", TEINTE); toast(VERRE_ACTIF ? "Liquid Glass activé" : "Liquid Glass désactivé : surfaces opaques"); menu(); };
  $("#m-anim").onclick = () => { ANIM_DOUCES = !ANIM_DOUCES; ecrire("alt974-doux", ANIM_DOUCES); document.documentElement.classList.toggle("doux", ANIM_DOUCES); toast(ANIM_DOUCES ? "Animations réduites" : "Animations liquides activées"); menu(); };
  $("#m-fav").onclick = () => { F.type = "fav"; sauver(); puces(); afficher(); fermer(); };
}
$("#b-menu").onclick = menu;

/* ---------- actualiser ---------- */
let MAJ_EN_COURS = false, DERNIERE_MAJ = 0;
async function actualiser(silence) {
  if (MAJ_EN_COURS) return; MAJ_EN_COURS = true; DERNIERE_MAJ = Date.now();
  if (silence === true) {  // à l'ouverture et au retour sur l'appli : sans bruit
    try {
      const r = await fetch("liste.json?t=" + Date.now(), {cache: "no-store"});
      if (r.ok) {
        const avant = new Set(OFFRES.map(a => a.id)), liste = await r.json();
        if (Array.isArray(liste) && (liste.length !== OFFRES.length || liste.some(a => !avant.has(a.id)))) {
          const nouv = liste.filter(a => !avant.has(a.id)).length;
          OFFRES = liste; DETAILS = DETAILS_P = null; chargerDetails(); puces(); afficher();
          if (nouv && avant.size) toast(`${nouv} nouvelle${nouv > 1 ? "s" : ""} offre${nouv > 1 ? "s" : ""} ajoutée${nouv > 1 ? "s" : ""}`);
        }
      }
    } catch (e) {}
    MAJ_EN_COURS = false; return;
  }
  $("#tirer").classList.add("tourne");
  try {
    const r = await fetch("liste.json?t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    const avant = new Set(OFFRES.map(a => a.id));
    OFFRES = await r.json(); DETAILS = DETAILS_P = null; chargerDetails();
    const nouv = OFFRES.filter(a => !avant.has(a.id)).length;
    puces(); afficher();
    toast(nouv ? `${nouv} nouvelle${nouv > 1 ? "s" : ""} offre${nouv > 1 ? "s" : ""}` : "Tout est à jour");
  } catch (e) { toast(navigator.onLine === false ? "Pas de connexion" : "Rechargement de la page…"); if (navigator.onLine !== false) setTimeout(() => location.reload(), 600); }
  $("#tirer").classList.remove("tourne"); $("#tirer").style.transform = ""; MAJ_EN_COURS = false;
}
// mise à jour toute seule : à l'ouverture, au retour sur l'appli et toutes les 30 min
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - DERNIERE_MAJ > 5 * 60e3) actualiser(true); });
setInterval(() => { if (!document.hidden) actualiser(true); }, 30 * 60e3);
// tirer la page vers le bas pour actualiser
let tirY = null, tirD = 0;
addEventListener("touchstart", e => { tirY = scrollY <= 0 && $("#voile").hidden && !e.target.closest("#carte") ? e.touches[0].clientY : null; tirD = 0; }, {passive: true});
addEventListener("touchmove", e => {
  if (tirY == null) return;
  tirD = Math.max(0, e.touches[0].clientY - tirY);
  $("#tirer").style.transform = `translate(-50%, ${Math.min(tirD, 110) - 60}px) rotate(${tirD * 3}deg)`;
}, {passive: true});
addEventListener("touchend", () => { if (tirY == null) return; tirY = null; if (tirD > 90) actualiser(); else $("#tirer").style.transform = ""; });

puces(); afficher();
// ouverture depuis une notification : #id de l'offre
function depuisLien() { const id = decodeURIComponent(location.hash.slice(1)); const a = id && OFFRES.find(x => x.id === id); if (a) { F.section = a.categorie || "alternance"; puces(); afficher(); fiche(id); } }
addEventListener("hashchange", depuisLien); depuisLien();
actualiser(true);
(window.requestIdleCallback || (f => setTimeout(f, 300)))(() => chargerDetails());
</script>
</body>
