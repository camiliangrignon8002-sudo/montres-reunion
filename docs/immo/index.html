<!doctype html>
<html lang="fr"><head><meta charset="utf-8">

<meta name="theme-color" content="#142224" media="(prefers-color-scheme: dark)">

</head><body>
<title>Seb Immo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Dossiers clients, pièces à réunir, relances, prix des biens et biens à vendre à La Réunion.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Mise en page : téléphone = barre du haut + menu ☰ qui glisse ; PC (≥ 960 px) = menu fixe à gauche,
   fiche dossier sur deux colonnes. Grosses cibles tactiles et texte à 17 px pour rester lisible. */
:root {
  --bg: #f3f6f6;
  --surface: #ffffff;
  --surface-2: #e9efef;
  --line: #d5dfdf;
  --fg: #142426;
  --fg-2: #4d6266;
  --accent: #0b6f78;
  --accent-fg: #ffffff;
  --accent-soft: #dcefef;
  --todo: #a3410f;
  --todo-soft: #fbe9dd;
  --cours: #8a6200;
  --cours-soft: #fbf1d2;
  --ok: #1c7240;
  --ok-soft: #e0f3e7;
  --shadow: 0 1px 2px rgba(10,40,44,.06), 0 6px 20px rgba(10,40,44,.07);
  --font: "Atkinson Hyperlegible", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-display: "Bricolage Grotesque", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r: 14px;
  --side: 264px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1617; --surface: #142224; --surface-2: #1b2d30; --line: #284044; --fg: #e8f1f1; --fg-2: #9fb5b8;
    --accent: #4cc3cc; --accent-fg: #062326; --accent-soft: #143a3e; --todo: #ff9b66; --todo-soft: #3a2014;
    --cours: #f0c64a; --cours-soft: #352a0c; --ok: #5fd58e; --ok-soft: #12321f; --shadow: 0 1px 2px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1617; --surface: #142224; --surface-2: #1b2d30; --line: #284044; --fg: #e8f1f1; --fg-2: #9fb5b8;
  --accent: #4cc3cc; --accent-fg: #062326; --accent-soft: #143a3e; --todo: #ff9b66; --todo-soft: #3a2014;
  --cours: #f0c64a; --cours-soft: #352a0c; --ok: #5fd58e; --ok-soft: #12321f; --shadow: 0 1px 2px rgba(0,0,0,.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font: 17px/1.45 var(--font); -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 1.55rem; font-weight: 800; }
h2 { font-size: 1.2rem; font-weight: 600; }
h3 { font-size: 1.02rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-2); }
.small { font-size: .88rem; }

/* ---- barre du haut et menu ---- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px;
  background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 10px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.top h1 { flex: 1; min-width: 0; font-size: 1.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.burger { width: 48px; height: 48px; border: 0; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; cursor: pointer; flex: none; }
.burger span, .burger span::before, .burger span::after { display: block; width: 22px; height: 2.5px; border-radius: 2px; background: var(--fg); position: relative; content: ""; }
.burger span::before { position: absolute; top: -7px; } .burger span::after { position: absolute; top: 7px; }
.side { position: fixed; z-index: 40; top: 0; bottom: 0; left: 0; width: min(86vw, var(--side)); background: var(--surface);
  border-right: 1px solid var(--line); transform: translateX(-102%); transition: transform .22s ease; overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 12px calc(env(safe-area-inset-bottom, 0px) + 16px) max(12px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 4px; }
.side.open { transform: none; box-shadow: var(--shadow); }
.voile { position: fixed; inset: 0; z-index: 35; background: rgba(5,20,22,.45); }
.marque { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
.marque svg { flex: none; }
.marque b { font-family: var(--font-display); font-size: 1.15rem; font-weight: 800; display: block; }
.side .groupe { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-2); padding: 14px 10px 4px; }
.lien { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 10px; border-radius: 10px; border: 0;
  background: none; text-align: left; cursor: pointer; width: 100%; text-decoration: none; color: var(--fg); }
.lien:hover { background: var(--surface-2); }
.lien.actif { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.lien .pt { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.lien .compte { margin-left: auto; font-size: .85rem; min-width: 26px; text-align: center; border-radius: 99px; padding: 1px 7px; background: var(--surface-2); color: var(--fg-2); font-weight: 700; }
.lien.actif .compte { background: var(--surface); }
main { padding-block: 18px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
@media (min-width: 960px) {
  .side { transform: none; width: var(--side); }
  .voile, .burger { display: none; }
  .appli { margin-left: var(--side); }
  .top { padding-left: 28px; padding-right: 28px; }
  main { padding-left: 28px; padding-right: 28px; }
}

/* ---- boutons ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 16px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; text-decoration: none; color: var(--fg); }
.btn:hover { border-color: var(--accent); }
.btn.plein { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--todo); }
.btn.danger.arme { background: var(--todo); color: var(--surface); border-color: var(--todo); }
.btn.petit { min-height: 40px; padding: 6px 12px; font-size: .92rem; }
.rangee { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ---- blocs ---- */
.bloc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.tete { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tuile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px;
  text-decoration: none; color: var(--fg); cursor: pointer; text-align: left; }
.tuile:hover { border-color: var(--accent); }
.tuile .val { font-family: var(--font-display); font-size: 1.9rem; font-weight: 800; line-height: 1.1; }
.tuile .lib { color: var(--fg-2); font-size: .92rem; }
.bandeau { border-radius: var(--r); padding: 12px 16px; background: var(--cours-soft); color: var(--fg); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.bandeau p { flex: 1; min-width: 200px; }
.vide { text-align: center; padding: 28px 16px; color: var(--fg-2); display: flex; flex-direction: column; gap: 12px; align-items: center; }

/* ---- statut ---- */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.s-traiter { background: var(--todo-soft); color: var(--todo); }
.s-encours { background: var(--cours-soft); color: var(--cours); }
.s-fini { background: var(--ok-soft); color: var(--ok); }
.pill.relance { background: var(--todo); color: var(--surface); }
.pill.relance::before { display: none; }
.pill.exemple { background: var(--surface-2); color: var(--fg-2); }
.pill.exemple::before { display: none; }

/* ---- liste de dossiers ---- */
.cartes { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.carte { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
  cursor: pointer; text-align: left; min-width: 0; }
.carte:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.carte .nom { font-family: var(--font-display); font-weight: 600; font-size: 1.12rem; }
.carte .ligne { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.barre { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.barre i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.recherche { width: 100%; min-height: 48px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--surface); }

/* ---- fiche dossier ---- */
.fiche { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 1100px) { .fiche { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; } }
.colonne { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.champs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 12px; }
.champ { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.champ label { font-size: .86rem; color: var(--fg-2); font-weight: 700; }
.champ input, .champ select, .champ textarea { min-height: 46px; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--bg); width: 100%; }
.champ textarea { min-height: 90px; resize: vertical; }
.piece { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.piece:first-child { border-top: 0; }
.coche { width: 44px; height: 44px; flex: none; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); cursor: pointer; display: grid; place-items: center; }
.coche svg { opacity: 0; }
.coche.ok { background: var(--ok); border-color: var(--ok); }
.coche.ok svg { opacity: 1; }
.piece .corps { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.piece .titre { font-weight: 700; overflow-wrap: anywhere; }
.piece.recu .titre { color: var(--fg-2); }
.fichiers { display: flex; flex-wrap: wrap; gap: 6px; }
.fichier { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: .86rem; background: var(--bg); cursor: pointer; max-width: 100%; }
.fichier span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }
.fichier img { width: 28px; height: 28px; object-fit: cover; border-radius: 4px; }
.outils { display: flex; gap: 6px; flex: none; }
.ico { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; color: var(--fg-2); }
.ico:hover { color: var(--accent); border-color: var(--accent); }
.ajout { display: flex; gap: 8px; }
.ajout input { flex: 1; min-width: 0; min-height: 46px; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--bg); }
.message { white-space: pre-wrap; background: var(--bg); border: 1px dashed var(--line); border-radius: 10px; padding: 12px; font-size: .95rem; overflow-wrap: anywhere; }
.canaux { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.contact { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.contact .val { font-weight: 700; user-select: all; overflow-wrap: anywhere; }
.histo { display: flex; flex-direction: column; gap: 4px; font-size: .92rem; color: var(--fg-2); margin: 0; padding-left: 18px; }
.types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.types button { min-height: 64px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.types button small { font-weight: 400; color: var(--fg-2); font-size: .78rem; }
.types button.choisi { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.enregistre { font-size: .86rem; color: var(--ok); font-weight: 700; }

/* ---- argent ---- */
.tableau { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 620px; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .82rem; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-2); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.cliquable { cursor: pointer; }
tr.cliquable:hover td { background: var(--surface-2); }
.plus { color: var(--ok); font-weight: 700; }
.moins { color: var(--todo); font-weight: 700; }

/* ---- biens achetables ---- */
.filtres { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.annonces { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.annonce { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.annonce .photo { aspect-ratio: 4 / 3; max-width: 100%; background: var(--surface-2); display: grid; place-items: center; color: var(--fg-2); }
.annonce .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.annonce .infos { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.annonce .prix { font-family: var(--font-display); font-size: 1.35rem; font-weight: 800; }
.annonce .actions { display: flex; gap: 8px; margin-top: auto; padding-top: 6px; flex-wrap: wrap; }
.annonce .actions .btn { flex: 1; }
.affaire { background: var(--ok-soft); color: var(--ok); }
.affaire::before { display: none; }
.onglets { display: flex; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 12px; width: fit-content; max-width: 100%; flex-wrap: wrap; }
.onglets button { min-height: 42px; border: 0; border-radius: 9px; background: none; padding: 6px 14px; cursor: pointer; font-weight: 700; color: var(--fg-2); }
.onglets button.actif { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }

/* ---- fenêtre ---- */
.fenetre-fond { position: fixed; inset: 0; z-index: 50; background: rgba(5,20,22,.5); display: flex; align-items: flex-end; justify-content: center; }
.fenetre { background: var(--surface); width: 100%; max-width: 620px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 700px) { .fenetre-fond { align-items: center; } .fenetre { border-radius: 18px; padding: 22px; } }
.fenetre img.apercu { max-height: 70vh; object-fit: contain; border-radius: 10px; background: var(--bg); }
.flottant { position: fixed; z-index: 15; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 6px 24px rgba(11,111,120,.35); border-radius: 99px; padding-inline: 20px; }
@media (min-width: 960px) { .flottant { display: none; } }
.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-weight: 700; max-width: calc(100vw - 32px); text-align: center; }
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }
</style>

<div class="voile" id="voile" hidden></div>
<nav class="side" id="menu" aria-label="Menu">
  <div class="marque">
    <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="var(--accent)"/><path d="M9 20.5 20 11l11 9.5V30a1 1 0 0 1-1 1h-6.5v-6.5h-7V31H10a1 1 0 0 1-1-1z" fill="var(--accent-fg)"/></svg>
    <div><b>Seb Immo</b><span class="muted small">La Réunion</span></div>
  </div>
  <button class="lien" data-vue="accueil">Accueil</button>
  <div class="groupe">Mes dossiers</div>
  <button class="lien" data-vue="traiter"><i class="pt" style="background:var(--todo)"></i>Dossiers à traiter<span class="compte" id="c-traiter">0</span></button>
  <button class="lien" data-vue="encours"><i class="pt" style="background:var(--cours)"></i>Dossiers en cours<span class="compte" id="c-encours">0</span></button>
  <button class="lien" data-vue="finis"><i class="pt" style="background:var(--ok)"></i>Dossiers finis<span class="compte" id="c-finis">0</span></button>
  <button class="lien" data-vue="tous">Tous les dossiers<span class="compte" id="c-tous">0</span></button>
  <div class="groupe">Biens</div>
  <button class="lien" data-vue="achetables">Biens achetables<span class="compte" id="c-achetables">–</span></button>
  <button class="lien" data-vue="argent">Mes biens et mon argent</button>
  <div class="groupe">Appli</div>
  <button class="lien" data-vue="reglages">Réglages et sauvegarde</button>
  <div style="flex:1"></div>
  <button class="btn plein" id="nouveau-menu" style="margin:10px 4px 0">+ Nouveau dossier</button>
</nav>

<div class="appli">
  <header class="top">
    <button class="burger" id="burger" aria-label="Ouvrir le menu" aria-controls="menu" aria-expanded="false"><span></span></button>
    <h1 id="titre">Accueil</h1>
  </header>
  <main id="vue"></main>
</div>
<button class="btn plein flottant" id="nouveau-flottant">+ Nouveau dossier</button>
<div id="fenetre"></div>

<script>
(() => {
"use strict";
const CLE = "immo974";
const JOUR = 86400000;

// ---------------------------------------------------------------- listes de pièces
const PIECES = {
  achat: ["Carte d'identité", "Livret de famille", "Justificatif de domicile (moins de 3 mois)",
    "3 derniers bulletins de salaire", "2 derniers avis d'imposition", "3 derniers relevés de compte",
    "Contrat de travail", "RIB", "Attestation de financement / accord de prêt", "Contrat de mariage ou PACS"],
  vente: ["Carte d'identité", "Livret de famille", "Titre de propriété", "Diagnostics (DPE, amiante, termites…)",
    "Dernière taxe foncière", "Plan cadastral", "Règlement de copropriété et 3 derniers PV d'AG",
    "Derniers appels de charges", "Justificatif de domicile", "RIB"],
  location: ["Carte d'identité", "Justificatif de domicile", "3 derniers bulletins de salaire", "Dernier avis d'imposition",
    "Contrat de travail", "RIB", "Attestation CAF", "Pièces du garant (identité, revenus)"]
};
const TYPES = { achat: "Achat", vente: "Vente", location: "Location" };
const STATUTS = { traiter: "À traiter", encours: "En cours", fini: "Fini" };
const MESSAGE = "Bonjour {prénom},\n\nC'est {mon nom}. Pour avancer sur votre dossier ({bien}), il me manque encore :\n{pièces}\n\nVous pouvez me les envoyer par mail ({mon email}) ou en photo par SMS / WhatsApp.\n\nMerci beaucoup et bonne journée !";

// ---------------------------------------------------------------- données
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ilYa = j => new Date(Date.now() - j * JOUR).toISOString();
function exemples() {
  const d = (prenom, nom, tel, email, type, bien, recus, extra) => {

// fichiers (photos, PDF) dans IndexedDB : trop gros pour le stockage simple
let base = null;
function ouvrirBase() {
  if (base) return base;
  base = new Promise((ok, ko) => {
    try {
      const r = indexedDB.open("immo974-fichiers", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("f");
      r.onsuccess = () => ok(r.result);
      r.onerror = () => ko(r.error);
    } catch (e) { ko(e); }
  });
  return base;
}
async function fichierEcrire(id, valeur) {
  const db = await ouvrirBase();

}
async function fichierLire(id) {
  const db = await ouvrirBase();
  return new Promise((ok, ko) => { const r = db.transaction("f").objectStore("f").get(id); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
}
async function fichierSuppr(id) {

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const euros = n => (n || n === 0) && !isNaN(n) ? Number(n).toLocaleString("fr-FR", { maximumFractionDigits: 0 }) + " €" : "—";
const dateFr = iso => iso ? new Date(iso).toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" }) : "";
const nomClient = d => [d.client.prenom, d.client.nom].filter(Boolean).join(" ") || "Client sans nom";
const nombre = v => { const n = parseFloat(String(v).replace(/\s/g, "").replace(",", ".")); return isNaN(n) ? null : n; };
function statut(d) {
  if (d.cloture) return "fini";
  const recus = d.pieces.filter(p => p.recu).length;
  if (d.pieces.length && recus === d.pieces.length) return "fini";
  return recus ? "encours" : "traiter";
}
const manquantes = d => d.pieces.filter(p => !p.recu);
function derniereRelance(d) { return d.relances.length ? d.relances[d.relances.length - 1].date : null; }
function aRelancer(d) {
  if (statut(d) === "fini" || !d.relanceAuto || !manquantes(d).length) return false;
  const depuis = derniereRelance(d) || d.cree;
  return Date.now() - new Date(depuis).getTime() >= (D.reglages.delai || 7) * JOUR;
}
function gain(d) {
  const b = d.bien;
  if (!b.vendu) return null;
  if (b.commission) return b.commission;
  if (b.prixVente && b.prixAchat) return b.prixVente - b.prixAchat - (b.frais || 0);
  return null;
}
function message(d) {
  const r = D.reglages;
  const liste = manquantes(d).map(p => "– " + p.nom).join("\n") || "– (rien, tout est reçu)";
  return (r.message || MESSAGE)
    .replaceAll("{prénom}", d.client.prenom || "")
    .replaceAll("{nom}", d.client.nom || "")
    .replaceAll("{mon nom}", r.nom || "votre conseiller")
    .replaceAll("{mon email}", r.email || "mon adresse mail")
    .replaceAll("{bien}", d.bien.adresse || TYPES[d.type].toLowerCase())
    .replaceAll("{pièces}", liste);
}
// 0692 / 0693 / 0262 → indicatif de La Réunion, sinon métropole
function international(tel) {
  let t = String(tel || "").replace(/[^\d+]/g, "");
  if (t.startsWith("+")) return t.slice(1);
  if (t.startsWith("00")) return t.slice(2);
  if (/^0(69[23]|262|263)/.test(t)) return "262" + t.slice(1);
  if (t.startsWith("0")) return "33" + t.slice(1);
  return t;
}

function toast(txt) {

  if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = txt; el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2600);
}
async function copier(txt, quoi) {
  try { await navigator.clipboard.writeText(txt); toast((quoi || "Texte") + " copié"); }

}

  const ok = () => { const e = m.querySelector("#ok"); e.hidden = false; clearTimeout(e.t); e.t = setTimeout(() => e.hidden = true, 1500); };
  const enreg = (redessiner) => { sauver(); ok(); if (redessiner) rendre(); };
  m.querySelector("#retour").onclick = () => aller(vue);
  m.querySelectorAll("[data-piece]").forEach(el => {
    const p = d.pieces.find(x => x.id === el.dataset.piece);

          p.fichiers.push({ id, nom: f.name, type: f.type });
        }
        if (fichiers.length && !p.recu) { p.recu = true; p.date = new Date().toISOString(); }

      } catch (err) { toast("Impossible de garder ce fichier sur cet appareil"); }

    d.relances.push({ date: new Date().toISOString(), canal: a.dataset.canal }); sauver();

  const sup = m.querySelector("#supprimer");
  sup.onclick = () => {
    if (!sup.classList.contains("arme")) { sup.classList.add("arme"); sup.textContent = "Toucher encore pour supprimer"; setTimeout(() => { sup.classList.remove("arme"); sup.textContent = "Supprimer le dossier"; }, 4000); return; }
    d.pieces.forEach(p => p.fichiers.forEach(f => fichierSuppr(f.id)));
    D.dossiers = D.dossiers.filter(x => x !== d); sauver(); toast("Dossier supprimé"); aller(vue);
  };
}
async function voirFichier(d, p, f) {
  let url = null;
  try { const v = await fichierLire(f.id); if (v) url = URL.createObjectURL(v.blob); } catch (e) {}
  const w = fenetre(`<div class="tete"><h2>${esc(p.nom)}</h2><button class="btn petit" id="fermer">Fermer</button></div>
    ${!url ? `<p>Ce fichier n'est plus sur cet appareil.</p>` : (f.type || "").startsWith("image/") ? `<img class="apercu" src="${url}" alt="${esc(f.nom)}">` : `<p>${esc(f.nom)}</p><a class="btn plein" href="${url}" target="_blank" rel="noopener">Ouvrir le PDF</a>`}
    <button class="btn danger" id="retirer">Retirer ce fichier</button>`);
  w.querySelector("#fermer").onclick = () => { fermerFenetre(); if (url) URL.revokeObjectURL(url); };
  w.querySelector("#retirer").onclick = () => { fichierSuppr(f.id); p.fichiers = p.fichiers.filter(x => x !== f); sauver(); fermerFenetre(); rendre(); };
}

      <div class="tuile"><span class="val num">${euros(enVente.reduce((s, d) => s + (d.bien.prixAffiche || 0), 0))}</span><span class="lib">Valeur des biens en cours</span></div>

    </div>

    ${avecBien.length ? `<div class="tableau"><table><thead><tr><th>Bien</th><th>Client</th><th class="n">Prix affiché</th><th class="n">Prix d'achat</th><th class="n">Vendu pour</th><th>Vente</th><th class="n">Ce que ça rapporte</th></tr></thead>
      <tbody>${[...enVente, ...vendus.sort((a, b) => (b.bien.dateVente || "").localeCompare(a.bien.dateVente || ""))].map(ligne).join("")}</tbody></table></div>`

      const v = JSON.parse(txt);
      if (!v || !Array.isArray(v.dossiers)) throw 0;
      D = v; D.reglages = Object.assign({ nom: "", email: "", tel: "", delai: 7, message: MESSAGE }, D.reglages || {});
      sauver(); toast(D.dossiers.length + " dossiers restaurés"); aller("accueil");
    } catch (e) { toast("Ce texte n'est pas une sauvegarde de l'appli"); }
  };
  m.querySelector("#restaurer").onclick = () => restaurer(m.querySelector("#coller").value);
  m.querySelector("#fichier-sauv").onchange = async e => { const f = e.target.files[0]; if (f) restaurer(await f.text()); };
}

// ---------------------------------------------------------------- démarrage
compter();
chargerBiens();
const h = (location.hash || "").slice(1);
if (h.startsWith("d") && D.dossiers.some(d => d.id === h.slice(1))) { vue = "tous"; dossierOuvert = h.slice(1); }
else if (TITRES[h]) vue = h;
rendre();
})();
</script>
